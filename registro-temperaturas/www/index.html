<!--
  REGISTRO DE TEMPERATURAS: app de un solo archivo (sin librerías externas, funciona sin internet).

  NOTAS PARA EMPAQUETAR CON CAPACITOR (Claude Code):
  1. Poner este archivo como www/index.html y usar webDir: "www" en capacitor.config.
  2. Instalar los plugins que usa la función guardarArchivo():
       npm i @capacitor/filesystem @capacitor/share
       npx cap sync android
     La app los busca en window.Capacitor.Plugins; si no existen, usa Compartir del navegador
     o una descarga normal.
  3. Android: el selector de fotos (input type=file) ya abre cámara y galería sin permisos extra.
     Si se quiere guardar en Documentos en Android 9 o menor, agregar WRITE_EXTERNAL_STORAGE.
  4. Datos: IndexedDB (fotos) y localStorage (ajustes), todo dentro del teléfono.
-->

:root{--cardbg:transparent;--ctl:#131313;--ctl2:#0A0A0A;--cardblur:none;--shadow:none;--asp:3/4;--ic:22px;--barh:6px;--bst:solid;--bgimg:none;--bgdim:linear-gradient(transparent,transparent);--ls:0px;--navbg:#0A0A0A;--navblur:none;--bg:#000000;--bg2:#10131C;--bgfill:#000000;--bgbot:#000000;--card:#131313;--card2:#0A0A0A;--line:#1E2022;--line2:#3A3D42;--nav:#0A0A0A;--tx:#FFFFFF;--mu:#9A9A9A;--ok:#4ADE80;--am:#F5B94A;--onok:#0B0B0C;--amBg:#241D0F;--okBg:#10261A;--red:#FF8A80;--sel:#FFFFFF;--onsel:#0B0B0C;--btnfill:#4ADE80;--onbtn:#0B0B0C;--mainfill:#FFFFFF;--onmain:#000000;--bw:0px;--bc:#3A3D42;--bd:var(--bw) var(--bst) var(--bc);--r:0px;--bs:1;--fs:1;--sp:1;--gc:2;--dur:240ms;--st:35ms;--ease:cubic-bezier(.2,.8,.2,1);--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);letter-spacing:var(--ls);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*28px))}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes sheetDown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){:root{--dur:0ms!important;--st:0ms!important}}
button,.cell,.mc,.chk,.sec,input,select{transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease),border-color var(--dur) var(--ease)}
button:active:not(:disabled){transform:scale(.96)}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bgdim),var(--bgimg),var(--bgfill);background-size:cover;background-position:center}
#top{padding:14px 16px 8px;flex:none}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.eyebrow{font-size:calc(12px*var(--fs));color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.date{background:transparent;border:0;color:var(--tx);font-family:inherit;font-weight:700;font-size:calc(24px*var(--fs));padding:0;margin-top:2px;width:210px;min-height:36px}
.pct{text-align:right;font-size:calc(24px*var(--fs));font-weight:700;color:var(--ok);line-height:1.1}
.pct small{display:block;font-size:calc(12px*var(--fs));font-weight:500;color:var(--mu)}
.icon{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
.bar{height:var(--barh);border-radius:calc(var(--r)*.3);background:var(--line2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--btnfill);border-radius:calc(var(--r)*.3);transition:width calc(var(--dur)*2) var(--ease)}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 calc(16px*var(--sp)) 16px;position:relative}
#main.enter{animation:slideIn var(--dur) var(--ease)}
#nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--navbg);backdrop-filter:var(--navblur);-webkit-backdrop-filter:var(--navblur);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
#nind{position:absolute;top:0;left:0;width:25%;height:3px;transform:translateX(calc(var(--ni,0)*100%));transition:transform calc(var(--dur)*1.2) var(--ease)}
#nind::after{content:"";position:absolute;left:50%;margin-left:-18px;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--btnfill)}
#nav button{border:0;background:transparent;min-height:calc(58px*var(--bs));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:calc(11px*var(--fs));color:var(--mu)}
#nav button.on{color:var(--tx);font-weight:700}
#nav button svg{transition:transform var(--dur) var(--ease)}
#nav button.on svg{transform:translateY(-2px) scale(1.08)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
.chip{flex:none;min-height:calc(44px*var(--bs));padding:0 14px;border-radius:var(--r);border:var(--bd);background:var(--ctl);display:flex;align-items:center;gap:8px;font-size:calc(15px*var(--fs));font-weight:600}
.chip.sel{background:var(--line2)}
.dot{width:8px;height:8px;border-radius:calc(var(--r)*.3);background:var(--line2);display:inline-block;transition:background-color var(--dur)}
.dot.g{background:var(--ok)}.dot.a{background:var(--am)}
h2{font-size:calc(20px*var(--fs));margin:6px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:calc(13px*var(--fs));color:var(--am);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(var(--gc),minmax(0,1fr));gap:calc(12px*var(--sp))}
.cell,.mc,.gen,.hist{animation:popIn var(--dur) var(--ease) both;animation-delay:calc(var(--i,0)*var(--st))}
.cell{border-radius:var(--r);border:var(--bd);background:var(--cardbg);backdrop-filter:var(--cardblur);-webkit-backdrop-filter:var(--cardblur);box-shadow:var(--shadow);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.cell .ph{aspect-ratio:var(--asp);position:relative;background:var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
.cell .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .lb{padding:10px 12px;font-size:calc(14px*var(--fs));font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cell .lb small{color:var(--mu);font-weight:500;font-size:calc(12px*var(--fs))}
.ck{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:calc(var(--r)*.8);background:var(--ok);color:var(--onok);display:flex;align-items:center;justify-content:center}
.cell.empty{background:var(--cardbg)}
.cell.empty .ph{background:var(--amBg);color:var(--am);font-size:calc(13px*var(--fs))}
.cell.empty .plus{width:48px;height:48px;border-radius:calc(var(--r)*1.7);background:var(--am);color:var(--bg);display:flex;align-items:center;justify-content:center}
.actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bgbot) 72%,transparent);padding:18px 0 4px;display:flex;gap:10px;margin-top:12px}
.btn{min-height:calc(52px*var(--bs));border-radius:var(--r);border:var(--bd);background:var(--ctl);font-size:calc(15px*var(--fs));font-weight:600;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--mainfill);color:var(--onmain);font-weight:700;flex:1}
.btn.go{background:var(--btnfill);color:var(--onbtn);font-weight:700;flex:1}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.4}
.mu{color:var(--mu);font-size:calc(14px*var(--fs));line-height:1.45;margin:6px 0 12px}
.empty-note{padding:32px 8px;text-align:center;color:var(--mu);font-size:calc(14px*var(--fs))}
.mx{display:grid;gap:6px;align-items:stretch}
.mx .h{font-size:calc(11px*var(--fs));color:var(--mu);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx .t{display:flex;align-items:center;font-size:calc(14px*var(--fs));font-weight:600}
.mc{aspect-ratio:var(--asp);border-radius:calc(var(--r)*.7);border:var(--bd);background:var(--cardbg);position:relative;overflow:hidden;padding:0}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc.p{background:var(--amBg);color:var(--am);display:flex;align-items:center;justify-content:center}
.mc .ck{width:16px;height:16px;right:3px;top:3px}
.gen{display:flex;gap:12px;padding:10px;border-radius:var(--r);border:var(--bd);background:var(--cardbg);backdrop-filter:var(--cardblur);-webkit-backdrop-filter:var(--cardblur);box-shadow:var(--shadow);margin-bottom:10px}
.gen img{width:84px;height:118px;object-fit:cover;border-radius:calc(var(--r)*.7);background:#000;flex:none}
.gen .meta{display:flex;flex-direction:column;gap:4px;font-size:calc(13px*var(--fs));color:var(--mu);min-width:0;flex:1}
.gen .meta b{color:var(--tx);font-size:calc(15px*var(--fs))}
.gen .meta .btn{min-height:calc(44px*var(--bs));margin-top:auto}
.hist{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);border:var(--bd);background:var(--cardbg);backdrop-filter:var(--cardblur);-webkit-backdrop-filter:var(--cardblur);box-shadow:var(--shadow);margin-bottom:10px}
.hist .r{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.hist .b{display:flex;gap:8px}.hist .b .btn{flex:1;min-height:calc(44px*var(--bs))}

<script>
'use strict';
/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);

const IC = {
  check: '<path d="M5 12l5 5L20 7"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', down: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',

  mat: '<path d="M4 6h16M4 12h16M4 18h16M9 4v16M15 4v16"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',

let toastT;

/* ===== Color y tema ===== */
const h2r = h => { h = h.replace('#', ''); if (h.length === 3) h = h.replace(/(.)/g, '$1$1'); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };

const PRESETS = {
  amoled: { n: 'AMOLED', bg: '#000000', card: '#131313', tx: '#FFFFFF', mu: '#9A9A9A', ok: '#4ADE80', am: '#F5B94A', sel: '#FFFFFF' },

  azul: { n: 'Azul noche', bg: '#0A1020', card: '#131C33', tx: '#E8EEFF', mu: '#9AA7C7', ok: '#5EEAD4', am: '#F5B94A', sel: '#E8EEFF' },
  claro: { n: 'Claro', bg: '#F4F5F7', card: '#FFFFFF', tx: '#111214', mu: '#5B6068', ok: '#15803D', am: '#B45309', sel: '#111214' },

const THEME_KEYS = ['bg', 'card', 'tx', 'mu', 'ok', 'am', 'sel'];
function applyTheme() {

  set('--bgbot', grad ? (u.bgDir === 'h' ? blend(t.bg, u.bg2, .5) : u.bgDir === 'd' ? blend(u.bg2, t.bg, .8) : u.bg2) : t.bg);

  exp: { title: 'REGISTRO DE TEMPERATURAS', turno: 'TURNO NOCHE', by: 'José Chávez', bg: '#000000', tx: '#FFFFFF', font: 'sistema', pending: 'PENDIENTE', quality: 92, scale: 100 },
  wm: { on: true, pos: 'over', size: 0.7, opacity: 1, place: 'Packing San Fernando', bar: '#F6B73C', code: true }

function loadCfg() {
  const d = JSON.parse(JSON.stringify(DEF));

/* ===== Estado ===== */
const S = { msgs: msgLoad(), tab: 'jornada', date: jornadaDateFor(Date.now()), ronda: 0, all: [], cfg: loadCfg(), urls: new Map(), gen: null };
const locs = () => S.cfg.locs.filter(l => l.on).map(l => l.n);

/* ===== Base de datos local (IndexedDB) ===== */

let topKind = '';

    const ap = t.closest('[data-ap]'); if (ap) { const s = S.cfg.saved.find(x => x.id === ap.dataset.ap); if (s) { Object.assign(S.cfg.theme, JSON.parse(JSON.stringify(s.theme))); Object.assign(S.cfg.ui, JSON.parse(JSON.stringify(s.ui))); applyTheme(); saveCfg(); buildSheet(); toast('Tema aplicado'); } return; }
    const dl = t.closest('[data-dl]'); if (dl) { S.cfg.saved = S.cfg.saved.filter(x => x.id !== dl.dataset.dl); saveCfg(); buildSheet(); return; }
    if (t.closest('#treset')) { S.cfg.theme = JSON.parse(JSON.stringify(DEF.theme)); S.cfg.ui = JSON.parse(JSON.stringify(DEF.ui)); applyTheme(); saveCfg(); buildSheet(); toast('Apariencia restablecida'); return; }
    if (t.closest('#mtreset')) { S.cfg.msg.text = DEF.msg.text; saveCfg(); buildSheet(); toast('Plantilla restaurada'); return; }
    if (t.closest('#bgUp')) { $('#bgIn').click(); return; }
    if (t.closest('#bgDel')) { setBgImg(null); toast('Imagen de fondo quitada'); return; }
    if (t.closest('#logoUp')) { $('#logoIn').click(); return; }
    if (t.closest('#logoDel')) { setLogo(null); S.gen = null; toast('Logo de Prolan restaurado'); return; }
  });
  el.addEventListener('input', e => { const t = e.target, k = t.dataset.k; if (k && (t.type === 'range' || t.type === 'color')) put(k, val(t)); });
  el.addEventListener('change', e => {
    const t = e.target, k = t.dataset.k;
    if (t.dataset.li != null || t.id === 'cslots') { readLS(); return; }
    if (k && t.tagName === 'TEXTAREA') { put(k, t.value); return; }
    if (k && (t.type === 'text' || t.type === 'checkbox' || t.tagName === 'SELECT')) { if (t.type === 'text' && k === 'exp.title' && !t.value.trim()) t.value = DEF.exp.title; put(k, t.type === 'text' ? t.value.trim() : val(t)); }
  });
}
function openSettings() {
  const el = $('#sheet'); openOv(el);
  if (!el._bound) { el._bound = true; bindSheet(el); }
  el.innerHTML = '<div class="ehead"><b>Ajustes</b><button class="icon" id="cclose" aria-label="Cerrar">' + svg(IC.x, 22) + '</button></div><div class="sheet" id="sbody"></div>';
  buildSheet();
}
/* ===== Imagen de fondo ===== */
function setBgImg(dataUrl) {
  S.bgImg = dataUrl || null;
  try { if (dataUrl) localStorage.setItem('rt_bgimg', dataUrl); else localStorage.removeItem('rt_bgimg'); } catch (e) { toast('La imagen es muy pesada para guardarla'); }
  applyTheme();
}
$('#bgIn').onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { const im = await loadImage(f); setBgImg(toCanvas(im, 1080).toDataURL('image/jpeg', 0.7)); toast('Imagen de fondo aplicada'); } catch (err) { toast('No se pudo leer la imagen'); }
  e.target.value = '';
};
/* ===== Logo ===== */
function setLogo(dataUrl) {
  if (!dataUrl) { S.logoImg = null; try { localStorage.removeItem('rt_logo'); } catch (e) {} return Promise.resolve(); }
  return new Promise(res => { const im = new Image(); im.onload = () => { S.logoImg = im; try { localStorage.setItem('rt_logo', dataUrl); } catch (e) { toast('El logo es muy grande para guardarlo'); } res(); }; im.onerror = () => res(); im.src = dataUrl; });
}
$('#logoIn').onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { const im = await loadImage(f); await setLogo(toCanvas(im, 500).toDataURL('image/png')); S.gen = null; toast('Logo guardado'); } catch (err) { toast('No se pudo leer el logo'); }
  e.target.value = '';
};
/* ===== Inicio ===== */
(async function () {
  try { S.bgImg = localStorage.getItem('rt_bgimg') || null; } catch (e) { S.bgImg = null; }
  applyTheme(); await new Promise(r => { const im = new Image(); im.onload = () => { S.logoDef = im; r(); }; im.onerror = r; im.src = LOGO_PROLAN_B64; }); try { const lg = localStorage.getItem('rt_logo'); if (lg) await setLogo(lg); } catch (e) {} await openDB(); S.all = (await allMeta()) || [];
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  bind(); render();
})();
</script>
