<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EUREKA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<style>
/* EUREKA — mismo estilo de la app de Base44: negro puro, texto blanco, grises zinc,
   ámbar para la acción principal, azul para selección y amarillo para los datos del lote. */
:root{
  --bg:#000; --panel:#0b0b0c; --panel2:#141416; --line:#27272a; --line2:#3f3f46;
  --fg:#fafafa; --fg2:#d4d4d8; --mut:#a1a1aa; --mut2:#8b8b94;
  --amber:#f59e0b; --amber-fg:#0a0a0a; --blue:#3b82f6; --blue2:#60a5fa; --yellow:#facc15;
  --green:#22c55e; --red:#ef4444; --purple:#a855f7; --orange:#fb923c;
  --r:14px; --r2:20px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overscroll-behavior:none}
body{font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none}
.ico-sm{width:16px;height:16px;flex:none}
.hide{display:none!important}

/* ---------- Pantallas ---------- */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar)}
.screen.layer{z-index:20;animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
.screen.layer.up{animation:slideUp .32s cubic-bezier(.2,.8,.2,1)}
.screen.closing{animation:slideOut .22s ease-in forwards}
.screen.up.closing{animation:slideDown .24s ease-in forwards}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(24px);opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideDown{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
#home .hero{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  min-height:clamp(170px,30vh,300px);padding:24px 16px 22px;position:relative;transition:min-height .3s}
#home.compact .hero{min-height:96px;padding-bottom:12px}
#home .hero h1{margin:0;font-size:clamp(52px,17vw,76px);font-weight:900;letter-spacing:-.06em;line-height:.9;transition:font-size .3s}
#home.compact .hero h1{font-size:40px}
#home .hero p{margin:14px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2)}
#home.compact .hero p{display:none}
.turno-chip{margin-top:10px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
#home.compact .turno-chip{display:none}
.hero-btn{position:absolute;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:999px;color:var(--mut)}
.hero-btn:active{transform:scale(.92)}
.hero-btn.r{right:8px}.hero-btn.l{left:8px}
.tabs-wrap{flex:none;display:flex;justify-content:center;padding:0 12px 16px}
.tabs{position:relative;display:flex;gap:4px;padding:6px;background:rgba(255,255,255,.05);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;padding:8px 12px;font-size:16px;font-weight:900;border-radius:999px;color:var(--mut2);white-space:nowrap;transition:color .2s}
.tab.on{color:var(--tab-fg,#fff)}
.tab-ind{position:absolute;z-index:0;top:6px;bottom:6px;border-radius:999px;background:var(--tab-bg,var(--blue));transition:left .32s cubic-bezier(.3,1.3,.5,1),width .32s cubic-bezier(.3,1.3,.5,1),background .2s}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:32px 32px 0 0;position:relative;background:var(--bg)}
.panel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to top,#000,rgba(0,0,0,.85) 40%,transparent);pointer-events:none;z-index:2}
.toolbar{flex:none;padding:4px 16px 10px;display:flex;gap:8px;align-items:center;z-index:3}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut2)}
.search input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 38px;font-size:14px}
.search input::placeholder{color:var(--mut2)}
.search input:focus{outline:none;border-color:var(--blue)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;color:var(--mut)}
.selbar{display:flex;gap:6px;animation:fadeIn .15s}
.sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.sq:active{transform:scale(.9)}
.sq.red{background:var(--red);color:#fff}.sq.amber{background:var(--amber);color:#000}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 12px 140px}
.grp{margin-bottom:22px}
.grp h2{margin:0;padding:0 8px 8px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut2);display:flex;justify-content:space-between;gap:8px}
.grp h2 span:last-child{font-weight:500;letter-spacing:0;text-transform:none}
.item{position:relative;overflow:hidden;border-radius:12px;margin-bottom:4px;animation:rise .3s both}
.item .acts{position:absolute;right:0;top:0;bottom:0;display:flex;gap:8px;align-items:center;padding-right:8px;opacity:0;pointer-events:none;transition:opacity .15s}
.item.open .acts{opacity:1;pointer-events:auto}
.act{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;color:#fff}
.act:active{transform:scale(.9)}
.act.g{background:#16a34a}.act.r{background:#dc2626}.act.y{background:#ca8a04}
.row{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:15px 12px;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:background .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.row.drag{transition:none}
.row.sel{background:var(--blue2);color:#000}
.row .main{flex:1;min-width:0}
.row h3{margin:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--mut)}
.row.sel .meta{color:rgba(0,0,0,.7)}
.row .meta .b{color:var(--blue2);font-weight:600}.row.sel .meta .b{color:#000}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.badge.ok{background:rgba(34,197,94,.14);color:#4ade80}
.badge.err{background:rgba(239,68,68,.15);color:#f87171}
.badge.warn{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.mut{background:rgba(255,255,255,.07);color:var(--mut)}
.star{color:var(--amber)}
.empty{display:flex;flex-direction:column;align-items:center;padding:56px 16px;text-align:center;color:var(--mut)}
.empty .big{font-size:30px;margin-bottom:10px}
.empty small{color:var(--mut2);margin-top:4px}

/* FAB */
.fab{position:fixed;z-index:15;right:calc(22px + var(--sar));bottom:calc(22px + var(--sab));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab-main{width:58px;height:58px;border-radius:999px;background:var(--amber);color:#000;display:grid;place-items:center;box-shadow:0 10px 30px rgba(245,158,11,.35);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fab.open .fab-main{transform:rotate(45deg)}
.fab-item{display:flex;align-items:center;gap:12px;background:#000;border:1px solid var(--line);border-radius:16px;padding:11px 18px 11px 14px;font-size:14px;box-shadow:0 20px 40px rgba(0,0,0,.6);animation:rise .2s both}
.fab-item svg{color:var(--blue2)}
.scrim{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.55);animation:fadeIn .15s}

/* ---------- Encabezado de pantallas internas ---------- */
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #18181b;min-height:64px;position:relative}
.back{width:46px;height:46px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg2);flex:none}
.back:active{transform:scale(.9)}
.hdr .ttl{flex:1;min-width:0;text-align:center}
.hdr .ttl b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{display:block;font-size:11px;color:var(--mut)}
.hdr .right{flex:none;display:flex;gap:6px;align-items:center}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2)}
.ibtn:active{transform:scale(.9)}
.ibtn.err{background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5);color:#f87171}
.ibtn.warn{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.45);color:#fbbf24}
.ibtn.ok{color:#4ade80}

/* ---------- Detalle de recepción ---------- */
.det{flex:1;min-height:0;display:flex}
.det-l{width:48%;min-width:170px;max-width:420px;display:flex;flex-direction:column;border-right:1px solid #18181b;min-height:0}
.det-r{flex:1;position:relative;min-width:0;background:linear-gradient(#0d0d0d,#050505 40%,#000)}
.lotehead{padding:16px 18px 6px;flex:none}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-bottom:2px}
.lote-big{font-size:clamp(34px,10vw,52px);font-weight:800;color:var(--yellow);line-height:1;word-break:break-word}
.var{margin-top:8px;font-size:14px;font-weight:700;color:rgba(250,204,21,.75);text-transform:uppercase;letter-spacing:.03em}
.prov{font-size:13px;color:var(--mut);margin-top:2px}
.info{flex:1;min-height:0;overflow-y:auto;padding:10px 18px 14px;display:flex;flex-direction:column;gap:14px}
.info .v{font-size:24px;font-weight:800}
.info .v.s{font-size:18px}
.info .v.y{color:var(--yellow)}.info .v.b{color:var(--blue2)}.info .v.g{color:#4ade80}.info .v.p{color:#c084fc}
.cap-btn{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:800;padding:4px 10px;border:1px dashed var(--line2);border-radius:10px}
.lotsel{flex:none;border-top:1px solid #18181b;padding:10px;max-height:38%;overflow-y:auto}
.lotsel .nav{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;color:var(--mut);font-size:11px}
.lotsel .nav button{width:32px;height:32px;display:grid;place-items:center;color:var(--mut)}
.lotsel .nav button:disabled{opacity:.25}
.lotbtn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:10px;font-size:14px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut)}
.lotbtn.on{background:var(--yellow);color:#000;border-color:var(--yellow)}
.lotbtn .dot{width:8px;height:8px;border-radius:99px;background:var(--red);flex:none}
.lotbtn small{font-weight:600;font-size:11px;opacity:.75}
.chip3d{position:absolute;z-index:3;background:rgba(0,0,0,.9);border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--mut);padding:6px 12px}
.chip3d b{color:var(--blue2)}
.chip3d.top{top:12px;left:50%;transform:translateX(-50%);white-space:nowrap}
.chip3d.side{left:8px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;padding:12px 6px}
.views{position:absolute;z-index:3;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.views button{font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.85);border:1px solid var(--line);color:var(--mut)}
.views button.on{color:var(--blue2);border-color:var(--blue)}
.nopucho{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut2);gap:6px;text-align:center;padding:16px}
.bbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #18181b;background:#000;padding-bottom:var(--sab)}
.bbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 2px;font-size:10px;letter-spacing:.04em;color:var(--mut)}
.bbar button:active{color:#fff;transform:scale(.95)}

/* ---------- Formularios / tarjetas ---------- */
.body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(110px + var(--sab))}
.sec{margin-bottom:18px}
.sec>h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2)}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:15px;min-width:0}
.inp:focus{outline:none;border-color:var(--blue)}
.inp.bad{border-color:var(--red);background:rgba(239,68,68,.07)}
.inp.warn{border-color:rgba(245,158,11,.6)}
textarea.inp{min-height:110px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.5}
.card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.bad{border-color:rgba(239,68,68,.5)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card .ch b{font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
.pill.on{background:var(--fg);color:#000;border-color:var(--fg)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);padding:6px 0}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:9px 11px;border-radius:10px;line-height:1.35}
.msg.error{background:rgba(239,68,68,.1);color:#fca5a5}
.msg.aviso{background:rgba(245,158,11,.1);color:#fcd34d}
.msg.info{background:rgba(59,130,246,.1);color:#93c5fd}
.msg.ok{background:rgba(34,197,94,.1);color:#86efac}
.msg button{margin-left:auto;text-decoration:underline;color:inherit;font-size:12px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);color:#000;border-color:var(--amber)}
.btn.white{background:#fff;color:#000;border-color:#fff}
.btn.danger{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.4)}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.footbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;padding:12px 16px calc(12px + var(--sab));background:linear-gradient(to top,#000 70%,transparent)}
.footbar .btn{flex:1}
details.raw{margin-top:8px}
details.raw summary{font-size:12px;color:var(--mut);cursor:pointer;padding:6px 0}
details.raw pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;color:var(--mut);background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto;margin:0}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.gtabs .pill{white-space:nowrap}

/* ---------- PESO ---------- */
.wsum{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;border-bottom:1px solid #18181b}
.wsum div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.wsum b{display:block;font-size:18px}
.wsum span{font-size:10px;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase}
.wl{margin-bottom:16px}
.wl>h5{margin:0 0 8px;display:flex;align-items:baseline;gap:8px;font-size:15px}
.wl>h5 b{color:var(--yellow)}
.wl>h5 small{color:var(--mut);font-weight:500;font-size:12px}
.wcard{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.wcard.done{border-color:rgba(34,197,94,.35)}
.wcard.warn{border-color:rgba(245,158,11,.5)}
.wcard .top{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #18181b;font-size:12px;color:var(--mut)}
.wcard .top b{color:var(--fg);font-size:13px}
.wcard .top .sp{flex:1}
.wcard .flds{display:flex}
.wcard .flds>div{flex:1;min-width:0;padding:7px 9px;border-left:1px solid #18181b}
.wcard .flds>div:first-child{border-left:0}
.wcard .flds label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.wcard .flds input{width:100%;background:none;border:0;padding:2px 0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.wcard .flds input:focus{outline:none;color:var(--yellow)}
.wcard .flds input::placeholder{color:#3f3f46}
.wcard .flds .neto{font-size:16px;font-weight:700;padding-top:2px;color:#4ade80}
.wcard .warnline{padding:6px 10px;font-size:12px;color:#fcd34d;background:rgba(245,158,11,.08)}

/* ---------- TOTAL ---------- */
.tot{flex:1;min-height:0;overflow:auto;display:flex}
.tcol{flex:1;min-width:66px;max-width:130px;display:flex;flex-direction:column}
.tcol .th{text-align:center;padding:12px 4px 8px;border-bottom:1px solid var(--line2);margin:0 6px}
.tcol .th p{margin:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcol .th div{font-size:10px;color:var(--mut);line-height:1.5}
.tcol .th div b{color:var(--fg)}
.tcol .bars{display:flex;flex-direction:column-reverse;gap:6px;padding:8px}
.tbar{height:28px;border-radius:7px;transform-origin:bottom;animation:grow .25s both}
@keyframes grow{from{transform:scaleY(0);opacity:0}}
.tfoot{flex:none;border-top:1px solid #18181b;padding:12px;text-align:center;color:var(--mut);padding-bottom:calc(12px + var(--sab))}
.tfoot b{color:var(--fg)}

/* ---------- Visor ---------- */
.viewer{flex:1;min-height:0;position:relative;overflow:hidden;background:#09090b;touch-action:none}
.viewer .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.viewer img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.viewer .hl{position:absolute;border:3px solid var(--yellow);background:rgba(250,204,21,.16);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.viewer .vnote{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center;padding:24px}

/* ---------- Hojas inferiores, diálogos, toast ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);animation:fadeIn .15s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:#000;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + var(--sab));animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}

const JABAS_PER_PALLET = 72;

// Fecha de TURNO: el turno va de 3:00 p. m. a 7:00 a. m.; antes de las 7:00 a. m. todavía cuenta
// el día anterior (el día en que empezó el turno). No cambia con la medianoche ni depende de la
// fecha que traiga la guía; se usa en la Hoja de Peso, los rótulos y el resumen del día.
const PF_TURNO_CORTE = 7;
function getShiftDateObj(){
  const d = new Date();
  if(d.getHours() < PF_TURNO_CORTE) d.setDate(d.getDate()-1);
  return d;
}
function getShiftDate(){
  return getShiftDateObj().toLocaleDateString('es-PE');

function calculatePallets(totalJabas, capacity = JABAS_PER_PALLET) {
  const safe = Math.max(0, totalJabas || 0);
  const cap = Math.max(1, capacity);
  const pallets = Math.floor(safe / cap);
  const sobrante = safe % cap;
  if (safe < cap) return { pallets: 0, jabas: safe, onlyJabas: true, operator: null };
  if (sobrante === 0) return { pallets, jabas: 0, onlyJabas: false, operator: null };
  if (cap === 72 && sobrante > 46) {
    return { pallets: pallets + 1, jabas: cap - sobrante, onlyJabas: false, operator: '-' };
  }
  return { pallets, jabas: sobrante, onlyJabas: false, operator: '+' };
}

// "N pallets − X jabas" (forma de mostrar); para filas y rótulos se necesita N−1 llenos + el resto.
function pfFisico(r, cap){
  if(r && r.operator === '-') return { pallets: Math.max(0, r.pallets - 1), jabas: cap - r.jabas, onlyJabas: r.pallets - 1 <= 0, operator:'+' };
  return r;
}
function calculateTotalJabas(pallets, jabasSueltas, capacity = JABAS_PER_PALLET) {
  const cap = Math.max(1, capacity);
  return (Math.max(0, pallets || 0) * cap) + Math.max(0, jabasSueltas || 0);

// cada texto), para que al imprimir 2 rótulos en una hoja A4 y cortarla a la mitad, el de abajo
// salga "volteado" tal como se pidió.
// El rótulo se diseña en su tamaño "natural" apaisado (LW x LH, como una tarjeta ancha) y se
// dibuja girado 90° dentro de una columna angosta y alta (x,y = esquina superior izq. de la
// columna), para que la hoja A4 quede apaisada con un rótulo "parado" a la izquierda y otro a
// la derecha — igual que la Hoja de Peso — y puedas cortarla a la mitad.
const ROTULO_LW = 210, ROTULO_LH = 148;
function drawRotuloContent(doc, colX, colY, d){
  const F = rotuloFontName();
  // T(lx,ly): coordenada local dentro del rótulo (sin girar, 0..LW / 0..LH) -> coordenada real
  // de la página, ya rotada 90°.
  // Con texto libre abajo, todo (menos la fecha y el N° de guía de arriba) sube 9 mm para dejarle lugar.
  let subir = d.nota ? 9 : 0;
  function T(lx, ly){ const y = ly > 20 ? ly - subir : ly; return [colX + y, colY + (ROTULO_LW - lx)]; }
  function put(lx, ly, text, opts){
    const [rx, ry] = T(lx, ly);
    doc.text(text, rx, ry, Object.assign({ angle: 90 }, opts||{}));
  }
  // Alineado "a la derecha" calculado a mano (en vez de align:'right'): con texto rotado 90°,
  // jsPDF puede hacer que el texto se salga del borde de la columna. Así, el ancho se resta
  // antes de anclar, y el texto nunca se sale de la hoja.
  function putRight(rightEdgeLx, ly, text){
    const w = doc.getTextWidth(text);
    put(rightEdgeLx - w, ly, text, {});
  }
  // Mismo problema con align:'center' + texto rotado: jsPDF lo calcula mal y el texto sale
  // desplazado/fantasma. Se centra a mano igual que putRight.
  function putCenter(centerLx, ly, text){
    const w = doc.getTextWidth(text);
    put(centerLx - w/2, ly, text, {});
  }
  // Dibuja varios trozos de texto seguidos, cada uno con su propio negrita/normal, alineados
  // a la izquierda desde lx (para "COD: " normal + "FF306" negrita, por ejemplo).
  function putMixedLeft(lx, ly, parts){
    let x = lx;
    parts.forEach((p) => {
      doc.setFont(F, p.bold?'bold':'normal');
      put(x, ly, p.text, {});
      x += doc.getTextWidth(p.text);
    });
  }
  // Igual, pero terminando exactamente en rightEdgeLx (para "CLP: 016-54150-" normal + "01" negrita).
  function putMixedRight(rightEdgeLx, ly, parts){
    let totalW = 0;
    parts.forEach((p) => { doc.setFont(F, p.bold?'bold':'normal'); totalW += doc.getTextWidth(p.text); });
    putMixedLeft(rightEdgeLx - totalW, ly, parts);
  }

  doc.setTextColor(0);

  // Posiciones y tamaños tomados EXACTOS de la plantilla PowerPoint (versión actualizada).
  doc.setFont(F,'bold'); doc.setFontSize(32);
  put(9, 17.2, d.fecha, {});
  if(d.numeroGuia) putRight(198, 17.1, d.numeroGuia);

  doc.setFontSize(24);
  {
    const provUpper = (d.proveedor||'').toUpperCase();
    // Cada logo quedó en su propia posición/tamaño, ajustados a mano por el usuario en la
    // plantilla editable (uno no es igual al otro).
    let logoImg = null, logoRatioWH = 1, logoLy = 32.4, logoThick = 12;
    if(provUpper.includes('FAMILY FARMS')){ logoImg = LOGO_FAMILYFARMS_ROT_PNG; logoRatioWH = 105/442; logoLy = 32.62; logoThick = 13.9; }
    else if(provUpper.includes('SUR EXPORT') || provUpper.includes('SUREXPORT')){ logoImg = LOGO_SUREXPORT_ROT_PNG; logoRatioWH = 125/356; logoLy = 32.4; logoThick = 21.1; }
    if(logoImg){
      // La imagen ya viene pre-girada 90°, así que se coloca "derecha" (sin angle) sobre las
      // coordenadas ya transformadas — mismo punto donde iría centrado el texto del proveedor.
      // El "grosor" (perpendicular a la fila) es la medida que de verdad importa para no chocar
      // con la fecha de arriba ni con el código grande de abajo — el "largo" tiene de sobra
      // dentro del ancho del rótulo, así que se deja libre según la proporción del logo.
      const finalThick = logoThick;
      const finalLen = finalThick / logoRatioWH;
      const [cx, cy] = T(ROTULO_LW/2, logoLy);
      try{ doc.addImage(logoImg, 'PNG', cx - finalThick/2, cy - finalLen/2, finalThick, finalLen); }catch(e){}
    } else {
      putCenter(ROTULO_LW/2, 32.4, d.proveedor);
    }
  }

  doc.setFontSize(48);
  putCenter(ROTULO_LW/2, 54.7, d.bigCode);

  doc.setFontSize(36);
  doc.setFont(F,'bold');
  put(14, 76, `${d.jabas} JABAS`, {});
  doc.setFontSize(44);
  putRight(180.5, 78.4, d.loteDisplay || '');

  // Ya no lleva la etiqueta "VARIEDAD:" — solo el valor, centrado, del mismo tamaño que el
  // correlativo (bigCode, 48pt).
  doc.setFont(F,'bold');
  doc.setFontSize(48);
  putCenter(ROTULO_LW/2, 99.8, d.variedad||'');

  doc.setFontSize(32);
  // "COD:" queda normal, el código en sí ("FF306", "SE01", "-"...) va en negrita.
  putMixedLeft(14, 119.3, [{ text:'COD: ', bold:false }, { text: d.codValue||'', bold:true }]);
  // "CLP:" y el resto del número van normal; solo los últimos 2 dígitos van en negrita.
  const clpStr = d.clp||'';
  const clpHead = clpStr.slice(0, Math.max(0, clpStr.length-2));
  const clpTail = clpStr.slice(-2);
  putMixedRight(192.3, 119.3, [{ text:'CLP: '+clpHead, bold:false }, { text: clpTail, bold:true }]);

  doc.setFont(F,'normal'); doc.setFontSize(28); doc.setTextColor(110);
  put(28, 137, `COD. MATERIAL: ${d.codMaterial||''}`, {});
  doc.setTextColor(0);

  // N° de viaje (el mismo que sale arriba a la derecha en la Hoja de Peso), en la esquina
  // inferior izquierda del rótulo — pegado a la esquina, con formato "V1", "V2"...
  if(d.numeroViaje){
    doc.setFont(F,'bold'); doc.setFontSize(40); doc.setTextColor(0);
    putCenter(9, 142, `V${d.numeroViaje}`);
  }
  // Cantidad de pallets del lote, misma fila, pero en la esquina inferior derecha (espejo del
  // N° de viaje) — como progresión "1/5", "2/5"... según qué pallet es este rótulo, sin negrita.
  if(d.totalPallets){
    doc.setFont(F,'normal'); doc.setFontSize(34); doc.setTextColor(0);
    // 1.5 dígitos más a la izquierda que antes: "12/12" ya no se corta en el borde
    putCenter(ROTULO_LW - 9 - doc.getTextWidth('0') * 1.5, 142, `${d.palletIndex===0 ? '   ' : (d.palletIndex||1)}/${d.totalPallets}`);
  }
  // Texto libre del lote (casilla "Texto en el rótulo"): abajo del todo, al ras del borde,
  // centrado; si es largo se achica hasta que entre en el ancho del rótulo.
  if(d.nota){
    subir = 0;   // el texto libre no se mueve: va abajo del todo
    doc.setFont(F,'bold'); doc.setTextColor(0);
    let fs = 32; doc.setFontSize(fs);   // mismo tamaño que "COD:" (en negrita)
    while(fs > 14 && doc.getTextWidth(d.nota) > ROTULO_LW - 10){ fs -= 1; doc.setFontSize(fs); }
    putCenter(ROTULO_LW/2, 145.8, d.nota);
  }
}
/* ============================================================
   TIPOGRAFÍA DEL RÓTULO: se incrusta Roboto (muy parecida a Segoe UI) en el PDF en vez de
   usar Helvetica por defecto. Si no se puede descargar (sin internet, CDN bloqueado), se
   sigue usando Helvetica automáticamente, sin romper la generación del rótulo.
   ============================================================ */
let ROTULO_FONT_REGULAR_B64 = null, ROTULO_FONT_BOLD_B64 = null, ROTULO_FONT_READY = false, ROTULO_FONT_TRIED = false;
async function ensureRotuloFontBytes(){
  if(ROTULO_FONT_READY || ROTULO_FONT_TRIED) return;
  ROTULO_FONT_TRIED = true;
  try{
    async function fetchAsBase64(url){
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('fuente ' + resp.status);
      const buf = await resp.arrayBuffer();
      let binary = ''; const bytes = new Uint8Array(buf);
      // un TTF empieza con 00 01 00 00 (o "true"); si no, es una página de error y se usa Helvetica
      if(!(bytes.length > 1000 && ((bytes[0]===0 && bytes[1]===1 && bytes[2]===0 && bytes[3]===0) || (bytes[0]===0x74 && bytes[1]===0x72)))) throw new Error('fuente inválida');
      for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    [ROTULO_FONT_REGULAR_B64, ROTULO_FONT_BOLD_B64] = await Promise.all([
      fetchAsBase64('https://cdn.jsdelivr.net/gh/google/fonts/apache/roboto/Roboto-Regular.ttf'),
      fetchAsBase64('https://cdn.jsdelivr.net/gh/google/fonts/apache/roboto/Roboto-Bold.ttf'),
    ]);
    ROTULO_FONT_READY = true;
  }catch(e){
    // Sin internet o CDN bloqueado: se sigue con Helvetica de respaldo, en silencio.
    ROTULO_FONT_READY = false;
  }
}
function registerRotuloFont(doc){
  if(!ROTULO_FONT_READY) return;
  try{
    doc.addFileToVFS('Roboto-Regular.ttf', ROTULO_FONT_REGULAR_B64);
    doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
    doc.addFileToVFS('Roboto-Bold.ttf', ROTULO_FONT_BOLD_B64);
    doc.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');
  }catch(e){ ROTULO_FONT_READY = false; }   // si la fuente falla, el rótulo sale igual con Helvetica
}
function rotuloFontName(){ return ROTULO_FONT_READY ? 'Roboto' : 'helvetica'; }
// Arma los datos y dibuja todas las páginas (2 rótulos por hoja, girados 90°) de UN lote dentro
// de un doc ya creado. `isFirstOfDoc` indica si es el primer lote que se dibuja en ese PDF (para
// no abrir una página en blanco extra al principio).
// Para Family Farms y Diamond Bridge: un solo correlativo continúa a través de TODAS las
// guías de ese mismo proveedor escaneadas a la vez (no uno por guía) — se toma del primer
// campo que tenga algo escrito, y cada lote de cada guía (en el orden en que se escanearon)
// sigue la numeración de corrido. Los demás proveedores (POB, Sur Export) siguen siendo uno
// por guía, como antes.
const PROVEEDORES_CORRELATIVO_GLOBAL = ['FF', 'DB'];
function esCorrelativoGlobal(prefix){ return PROVEEDORES_CORRELATIVO_GLOBAL.includes(prefix); }
// Diamond Bridge: si la guía trae algún lote EUREKA SUNRISE, esa guía NO sigue la numeración de
// corrido de las demás guías de Diamond — tiene su propio correlativo, que se escribe a mano.
function esGuiaDBIndependiente(g){ return !!g && getProviderPrefix(g.proveedor)==='DB' && (g.lotes||[]).some(l=>!!codFFenDB(l.variedad)); }
function usaCorrelGlobal(g){ return esCorrelativoGlobal(getProviderPrefix(g.proveedor)) && !esGuiaDBIndependiente(g); }
function correlBaseDe(g){ return usaCorrelGlobal(g) ? getCorrelBaseGlobal(getProviderPrefix(g.proveedor)) : parseInt(g.rotuloCorrelativo, 10); }
function correlDe(g, loteIdx){ const b = correlBaseDe(g); return usaCorrelGlobal(g) ? b + getGlobalLoteOffset(getProviderPrefix(g.proveedor), g, loteIdx) : b + loteIdx; }
function getCorrelBaseGlobal(prefix){
  for(const g of guides){
    if(getProviderPrefix(g.proveedor) === prefix && !esGuiaDBIndependiente(g)){
      const n = parseInt(g.rotuloCorrelativo, 10);
      if(!isNaN(n)) return n;
    }
  }
  return NaN;
}
function getGlobalLoteOffset(prefix, targetGuide, targetLoteIdx){
  let offset = 0;
  const firstOffsetByGnum = {};
  for(const g of guides){
    if(getProviderPrefix(g.proveedor) !== prefix) continue;
    if(esGuiaDBIndependiente(g) && g !== targetGuide) continue; // no cuenta en la numeración de corrido
    const gnum = (g.numero_guia||'').trim().toUpperCase();
    // Si esta guía (mismo número) ya apareció antes en la lista, es un reescaneo: usa el mismo
    // punto de partida que tuvo la primera vez, y no vuelve a sumar sus lotes al conteo.
    const isDup = gnum && firstOffsetByGnum[gnum] !== undefined;
    const thisOffset = isDup ? firstOffsetByGnum[gnum] : offset;
    if(g === targetGuide) return thisOffset + targetLoteIdx;
    if(gnum && !isDup) firstOffsetByGnum[gnum] = offset;
    if(!isDup) offset += g.lotes.length;
  }
  return targetLoteIdx;
}
// Se llama justo después de agregar una guía escaneada de Family Farms o Diamond Bridge.
// Sugiere/asigna el correlativo automáticamente, continuando el último usado (guardado en
// este dispositivo), y evita "correr" el número si la guía ya se había escaneado antes.
function applyAutoCorrelativo(guide){
  const prefix = getProviderPrefix(guide.proveedor);
  if(!prefix) return;
  if(esGuiaDBIndependiente(guide)) return; // EUREKA SUNRISE en Diamond: correlativo a mano
  const st = correlativoAutoState[prefix] || (correlativoAutoState[prefix] = { lastUsed:0, seenGuides:{} });
  if(!st.seenGuides) st.seenGuides = {};
  const gnum = (guide.numero_guia||'').trim().toUpperCase();
  if(gnum && st.seenGuides[gnum] != null){
    // esta guía ya se imprimió (o guardó) antes: se reutiliza el mismo correlativo, no se vuelve a contar
    guide.rotuloCorrelativo = String(st.seenGuides[gnum]);
    return;
  }
  if(usaCorrelGlobal(guide)){
    // Family Farms / Diamond: un solo correlativo corre por todas sus guías en pantalla;
    // la primera de la sesión continúa donde quedó la última impresión
    const isFirstOfPrefixInSession = !guides.some(g => g!==guide && getProviderPrefix(g.proveedor)===prefix && !esGuiaDBIndependiente(g));
    if(isFirstOfPrefixInSession) guide.rotuloCorrelativo = String((st.lastUsed||0) + 1);
    return;
  }
  // POB, Sur Export y los demás: cada guía su propio correlativo, sigue después del último usado
  // (impreso antes o de otra guía del mismo proveedor que ya está en pantalla)
  let ult = st.lastUsed || 0;
  for(const g of guides){
    if(g === guide || getProviderPrefix(g.proveedor) !== prefix || esGuiaDBIndependiente(g)) continue;
    const n = parseInt(g.rotuloCorrelativo, 10); if(isNaN(n)) continue;
    const gn = (g.numero_guia||'').trim().toUpperCase();
    if(gnum && gn === gnum){ guide.rotuloCorrelativo = String(n); return; }   // reescaneo de la misma guía
    ult = Math.max(ult, n + Math.max(0, (g.lotes||[]).length - 1));
  }
  guide.rotuloCorrelativo = String(ult + 1);
}
// Al imprimir rótulos se guarda solo hasta dónde quedó cada proveedor (todos los proveedores):
// la próxima guía de ese proveedor sugiere el número siguiente, aunque se hayan borrado las guías.
function pfCorrAnclarGuia(g){
  try{
    const prefix = getProviderPrefix(g && g.proveedor);
    if(!prefix || esGuiaDBIndependiente(g)) return;
    const base = correlDe(g, 0);
    if(isNaN(base)) return;
    const fin = base + Math.max(0, (g.lotes||[]).length - 1);
    const st = correlativoAutoState[prefix] || (correlativoAutoState[prefix] = { lastUsed:0, seenGuides:{} });
    if(!st.seenGuides) st.seenGuides = {};
    const gnum = (g.numero_guia||'').trim().toUpperCase();
    const yaVista = gnum && st.seenGuides[gnum] != null;
    if(gnum) st.seenGuides[gnum] = base;
    // guía nueva: el contador queda donde terminó (permite reiniciar escribiendo otro número a mano);
    // reimpresión de una guía ya vista: no hace retroceder el contador
    st.lastUsed = yaVista ? Math.max(st.lastUsed||0, fin) : fin;
    st.t = Date.now();
    const claves = Object.keys(st.seenGuides);
    if(claves.length > 400) claves.slice(0, claves.length - 400).forEach(k => delete st.seenGuides[k]);
  }catch(e){}
}
// Se llama al presionar el botón "Guardar" junto al correlativo. Confirma el valor actual como
// la base real, y guarda en este dispositivo hasta dónde quedó consumido para TODAS las guías
// de este proveedor en la sesión actual — la próxima guía escaneada (incluso en otra sesión)
// sugerirá el siguiente número a partir de aquí. Si el usuario cambia el número a mano y vuelve
// a guardar, la regla se aplica igual sobre el nuevo valor.
function saveCorrelativoAnchor(guide){
  const prefix = getProviderPrefix(guide.proveedor);
  if(!prefix || esGuiaDBIndependiente(guide)) return;
  if(!usaCorrelGlobal(guide)){
    // POB, Sur Export, Allpa…: cada guía tiene su correlativo; se guarda hasta dónde llega ESTA guía,
    // solo para este proveedor (cada proveedor lleva su propio contador)
    const base = parseInt(guide.rotuloCorrelativo, 10);
    if(isNaN(base)){ pfAlerta('Escribe primero un correlativo válido.'); return; }
    pfCorrAnclarGuia(guide); saveCorrelativoAutoState();
    try{ window.pfSyncAhora && window.pfSyncAhora(); }catch(e){}
    const st = correlativoAutoState[prefix] || {};
    const msg = $('rotuloCorrelSaveMsg');
    if(msg){ msg.textContent = `Guardado (${prefix}). Próxima guía sugiere ${(st.lastUsed||0)+1}.`; }
    speakRandom(TTS_CORRELATIVO_OK);
    return;
  }
  const correlBase = getCorrelBaseGlobal(prefix);
  if(isNaN(correlBase)){ pfAlerta('Escribe primero un correlativo válido.'); return; }
  const st = correlativoAutoState[prefix] || (correlativoAutoState[prefix] = { lastUsed:0, seenGuides:{} });
  let maxConsumed = correlBase - 1;
  const seenNums = new Set();
  guides.forEach((g) => {
    if(getProviderPrefix(g.proveedor) !== prefix || esGuiaDBIndependiente(g)) return;
    const gnum = (g.numero_guia||'').trim().toUpperCase();
    if(gnum && seenNums.has(gnum)) return; // reescaneo dentro de la misma sesión, ya contado
    if(gnum) seenNums.add(gnum);
    const start = correlBase + getGlobalLoteOffset(prefix, g, 0);
    if(gnum) st.seenGuides[gnum] = start;
    maxConsumed = Math.max(maxConsumed, start + Math.max(0, g.lotes.length - 1));
  });
  st.lastUsed = maxConsumed; st.t = Date.now();
  saveCorrelativoAutoState();
  const msg = $('rotuloCorrelSaveMsg');
  if(msg){ msg.textContent = `Guardado (${prefix}). Próxima guía sugiere ${maxConsumed+1}.`; }
  try{ window.pfSyncAhora && window.pfSyncAhora(); }catch(e){}
  speakRandom(TTS_CORRELATIVO_OK);
}
// Caso especial: una guía de Diamond Bridge donde la variedad es "EUREKA SUNRISE" — esa
// variedad es de Family Farms, no de Diamond Bridge, así que el código de ese lote se arma
// como si fuera de Family Farms (prefijo "FF", código de variedad "EE") en vez de "DB", y el
// correlativo NO sigue la numeración automática de ningún proveedor — se escribe a mano para
// cada lote así (botón "Correlativo manual" en la tarjeta del lote).
// Pallets reales de un lote (sin el rótulo de repuesto de Valle Azul), igual que los rótulos
function palletsRotuloDeLote(guide, l){
  if(esValleAzulSinJabas(guide, l)) return Math.max(0, parseInt(l.cantidad,10)||0);
  const cap = (l.jarras || l.verde) ? 50 : ((guide && guide.capacity) || capacity);
  if((parseInt(l.cantidad,10)||0) <= 0) return 0;
  const r = pfFisico(calculatePallets(parseInt(l.cantidad,10)||0, cap), cap);
  return (!r.onlyJabas ? r.pallets : 0) + ((r.onlyJabas || r.jabas>0) ? 1 : 0);
}
// Variedades de Family Farms que llegan en guías de Diamond Bridge, con su código de lote
const FF_EN_DB_COD = { 'SUNRISE':'PDB106', 'SUNSET':'PDB108', 'GOLD':'PDB109', 'MAXX':'PDB110' };
function codFFenDB(variedad){
  const n = normalizeVariedad(variedad);
  const k = Object.keys(FF_EN_DB_COD).find(w => n.split(' ').includes(w));
  return k ? FF_EN_DB_COD[k] : '';
}
function esLoteFFenGuiaDB(guide, lote){
  return getProviderPrefix(guide.proveedor)==='DB' && !!codFFenDB(lote.variedad);
}
function buildRotuloDataForLote(guide, loteIdx){
  const lote = guide.lotes[loteIdx];
  if(!lote) return null;
  let prefix = getProviderPrefix(guide.proveedor);
  if(!prefix) return null;
  const esCasoFFenDB = esLoteFFenGuiaDB(guide, lote);

  let correlBase, correl;
  // La guía de Diamond con EUREKA SUNRISE usa su propio correlativo (escrito a mano en la guía);
  // el lote EUREKA SUNRISE se arma como Family Farms (prefijo FF, variedad EE).
  correlBase = correlBaseDe(guide);
  if(isNaN(correlBase)) return null;
  correl = correlDe(guide, loteIdx);
  if(esCasoFFenDB) prefix = 'FF';

  const row = findLabelRow(esCasoFFenDB ? 'FAMILY FARMS' : guide.proveedor, lote.variedad);
  const varCode = row ? row.cod : findVarietyAbbr(lote.variedad);
  const sap = row ? row.sap : '';
  const year = String(getShiftDateObj().getFullYear()).slice(-2);
  // El correlativo siempre va con 4 dígitos (ej "534" -> "0534").
  const correlPadded = String(correl).padStart(4,'0');
  const bigCode = `${prefix}${year}${varCode}${correlPadded}`;
  // POB/Sur Export: el lote de la guía viene como "M1 S1" (o "M1-S1"). En el rótulo, "Lote"
  // muestra "MD" + el número de la parte "M" (ej "M1" -> "MD1") y "COD:" usa el número de la
  // parte "S1" (ej "S1" -> "SE01").
  const pobSrxSplit = splitPobSrxLote(lote.lote);
  const pobSrxSNum = pobSrxSplit.codigo ? (pobSrxSplit.codigo.match(/\d+/) || [''])[0] : '';
  const pobSrxMNum = pobSrxSNum ? (pobSrxSplit.campo.match(/\d+/) || [''])[0] : '';
  // "LOTE": Family Farms lleva el prefijo "LT-" (ej "LT-3"); POB/Sur Export es "MD" + el
  // número del lote (ej "M1" -> "MD1").
  const loteDisplay = prefix === 'FF'
    ? `LT-${lote.lote||''}`
    : (pobSrxMNum ? `MD${pobSrxMNum}` : String(lote.lote||''));
  // "COD:" — Family Farms: prefijo+lote+código de variedad (ej "FF306"). Valle Azul: igual,
  // pero con "PVA" en vez de "FF" (ej "PVA406"). Diamond Bridge: no tiene código en ningún
  // lote, así que va solo un guion "-". POB/Sur Export: código de variedad + el número de la
  // parte "S" del lote (ej lote "M1 S1" -> "SE01").
  let codValue;
  if(esCasoFFenDB) codValue = codFFenDB(lote.variedad); // PDB106 / PDB108 / PDB109 / PDB110
  else if(isValleAzulProv(guide.proveedor)) codValue = `PVA${ffCodigoFor(lote)}`;
  else if(prefix === 'FF') codValue = `${prefix}${ffCodigoFor(lote)}`;
  else if(prefix === 'DB') codValue = '-';
  else codValue = `${varCode}${pobSrxSNum ? pobSrxSNum.padStart(2,'0') : '01'}`;

  let jabasPorRotulo;
  if(esValleAzulSinJabas(guide, lote)){
    // Valle Azul: la guía ya dice "X pallets" por lote — se imprime esa cantidad de rótulos
    // MÁS 1 adicional, y todos salen sin número de jabas (se anota a mano con plumón).
    const p = Math.max(0, parseInt(lote.cantidad,10)||0) + 1;
    jabasPorRotulo = new Array(p).fill('');
  } else {
    const cap = (lote.jarras || lote.verde) ? 50 : ((guide && guide.capacity) || capacity);
    const r = pfFisico(calculatePallets(parseInt(lote.cantidad,10)||0, cap), cap);
    jabasPorRotulo = [];
    if((parseInt(lote.cantidad,10)||0) <= 0) return null;   // sin jabas: no hay rótulo
    if(!r.onlyJabas){ for(let i=0;i<r.pallets;i++) jabasPorRotulo.push(cap); }
    if(r.onlyJabas || r.jabas>0){ jabasPorRotulo.push(r.onlyJabas ? r.jabas : r.jabas); }
  }
  if(jabasPorRotulo.length === 0) return null;
  // Contador "N/T": Family Farms por lote (como siempre); los demás proveedores corren el
  // número por TODOS los lotes de la guía, para saber cuántos pallets trae cada proveedor.
  let contador = null;
  if(!isFFProv(guide.proveedor)){
    let offset = 0, total = 0;
    guide.lotes.forEach((l2, k) => { const n = palletsRotuloDeLote(guide, l2); if(k < loteIdx) offset += n; total += n; });
    contador = { offset, total, reales: palletsRotuloDeLote(guide, lote) };
  }

  // Prioridad de la fecha del rótulo: fecha manual del lote > "ayer" del lote >
  // fecha manual universal > "ayer" universal > fecha de turno (3pm-7am, ver getShiftDate).
  function shiftDateMinusOne(){
    const d = new Date();
    if(d.getHours() < PF_TURNO_CORTE) d.setDate(d.getDate()-1);
    d.setDate(d.getDate()-1);
    return d.toLocaleDateString('es-PE');
  }
  let fechaTexto = null;
  if(lote.rotuloFechaAyer){ fechaTexto = shiftDateMinusOne(); }
  else if(rotuloFechaAyer){ fechaTexto = shiftDateMinusOne(); }
  else { fechaTexto = getShiftDate(); }

  return {
    bigCode, jabasPorRotulo, contador,
    // identifica la FILA de la guía (no solo "MD1": en POB "M1 S1" y "M1 S2" muestran el mismo lote)
    loteKey: [loteIdx, lote.lote || '', normalizeVariedad(lote.variedad || ''), lote.clp || ''].join('|').toUpperCase(),
    dataBase: {
      fecha: fechaTexto,
      numeroGuia: guide.numero_guia || '',
      numeroViaje: guide.numeroViaje || '',
      totalPallets: jabasPorRotulo.length,
      proveedor: esCasoFFenDB ? 'FAMILY FARMS' : (guide.proveedor || ''), // arriba del correlativo va Family Farms
      bigCode, loteDisplay, variedad: lote.variedad,
      clp: lote.clp || '', codMaterial: sap, codValue,
      nota: (lote.rotuloNotaOn && String(lote.rotuloNota || '').trim()) || '',
    },
  };
}
/* ============================================================
   RÓTULOS = HOJA DE PESO EDITADA
   Si la hoja de peso de la guía se editó a mano (filas, jabas, lote, código, CLP), los rótulos
   salen igual que esa hoja: un rótulo por cada fila de pallet del lote, con las jabas escritas.
   ============================================================ */
const pfFilaVacia = r => !['campo','codigo','clp','pesoBruto','pesoPalet','jabas','obs'].some(k => String(r[k] == null ? '' : r[k]).trim());
function pfHojaGrupos(rows){
  const G = [];
  (rows || []).forEach((r, i) => {
    const nuevo = i === 0 || r.li != null || !!r.correlativoCode || !!String(r.campo || '').trim();
    if (nuevo || !G.length) G.push({ li:r.li, filas:[] });
    G[G.length - 1].filas.push(r);
  });
  return G;
}
// filas de pallet de un grupo: todas menos la fila de repuesto en blanco del final
function pfPalletsDeGrupo(g){
  const f = g.filas.slice();
  if (f.length > 1 && pfFilaVacia(f[f.length - 1])) f.pop();
  return f;
}
function pfGrupoDeLote(guide, loteIdx){
  const ov = guide && guide.hojaPesoOverride; if (!ov) return null;
  const G = pfHojaGrupos(ov);
  if (G.some(g => g.li != null)) {
    const g = G.find(x => x.li === loteIdx);
    return g ? { grupo:g, todos:G.filter(x => x.li != null) } : { borrado:true };
  }
  // hoja editada con una versión anterior (sin marca de lote): por orden
  let auto = []; try { auto = pfHojaGrupos(buildPalletRows(guide)); } catch (e) {}
  if (auto.length !== G.length) return null;
  const k = auto.findIndex(a => a.li === loteIdx); if (k < 0) return null;
  G.forEach((g, i) => { g.li = auto[i].li; });
  return { grupo:G[k], todos:G };
}
const _pfRotuloBase = buildRotuloDataForLote;
buildRotuloDataForLote = function(guide, loteIdx){
  const info = _pfRotuloBase(guide, loteIdx);
  let m = null; try { m = pfGrupoDeLote(guide, loteIdx); } catch (e) { m = null; }
  if (!m) return info;
  if (m.borrado) return null;              // el lote se quitó de la hoja editada: no lleva rótulo
  if (!info) return info;
  const pal = pfPalletsDeGrupo(m.grupo);
  if (!pal.length) return null;
  const lote = guide.lotes[loteIdx] || {};
  const jab = pal.map(r => { const t = String(r.jabas == null ? '' : r.jabas).trim(); return t === '' ? '' : (parseInt(t, 10) || t); });
  info.jabasPorRotulo = esValleAzulSinJabas(guide, lote) ? jab.concat(['']) : jab;   // Valle Azul: +1 de repuesto
  info.dataBase.totalPallets = info.jabasPorRotulo.length;
  if (info.contador) {
    let offset = 0, total = 0; const ord = m.todos.slice().sort((a, b) => a.li - b.li);
    ord.forEach(g => { const n = pfPalletsDeGrupo(g).length; if (g.li < loteIdx) offset += n; total += n; });
    info.contador = { offset, total, reales:pal.length };
  }
  // lote / código / CLP cambiados a mano en la hoja
  let a = null; try { a = pfHojaGrupos(buildPalletRows(guide)).find(g => g.li === loteIdx); } catch (e) {}
  const f0 = m.grupo.filas[0], a0 = (a && a.filas[0]) || {};
  const dif = k => String(f0[k] || '').trim() !== String(a0[k] || '').trim() && String(f0[k] || '').trim() !== '';
  const pobSrx = isPobSrxProv(guide.proveedor), esFF = /^FF/.test(info.bigCode);
  if (dif('campo')) {
    const c = String(f0.campo).trim(), n = (c.match(/\d+/) || [''])[0];
    info.dataBase.loteDisplay = pobSrx ? (n ? `MD${n}` : c) : esFF ? `LT-${c.replace(/^LT-?/i, '')}` : c;
  }

    const c = String(f0.codigo).trim(), letras = (String(info.dataBase.codValue || '').match(/^[A-Za-z]+/) || [''])[0];
    info.dataBase.codValue = /^[A-Za-z]/.test(c) ? c.toUpperCase() : pobSrx ? letras + ((c.match(/\d+/) || [c])[0]).padStart(2, '0') : letras + c;
  }

    const n = (String(f0.correlativoCode || '').match(/(\d+)\s*$/) || [])[1];

// Al editar o quitar un lote en la tarjeta, la hoja editada se actualiza en ese lote (y se
// conservan los pesos ya escritos), para que hoja y rótulos sigan iguales.
function pfHojaReconciliar(guide, accion, idx, antes){
  const ov = guide && guide.hojaPesoOverride; if (!ov) return;
  let G = pfHojaGrupos(ov);
  if (!G.some(g => g.li != null)) { const auto = pfHojaGrupos(buildPalletRows(guide)); if (auto.length !== G.length) return; G.forEach((g, i) => { g.li = auto[i].li; }); }
  if (accion === 'borrar') {
    G = G.filter(g => g.li !== idx);
    G.forEach(g => { if (g.li != null && g.li > idx) g.li--; });
  } else {
    const nuevo = pfHojaGrupos(buildPalletRows(guide)).find(g => g.li === idx);
    const k = G.findIndex(g => g.li === idx);
    if (!nuevo) { if (k >= 0) G.splice(k, 1); }
    else {
      const lote = guide.lotes[idx] || {};
      const mismaCant = antes && ['cantidad','jarras','jarras_cantidad','vaJabasManual'].every(c => String(antes[c] == null ? '' : antes[c]) === String(lote[c] == null ? '' : lote[c]));
      if (k >= 0 && mismaCant) {
        // la cantidad no cambió: se queda TODO lo editado en la hoja (filas, jabas, pesos);
        // solo se actualiza lo que se cambió en la tarjeta (lote / CLP)
        const f0 = G[k].filas[0], n0 = nuevo.filas[0];
        if (String(antes.lote || '') !== String(lote.lote || '')) { f0.campo = n0.campo; f0.codigo = n0.codigo; }
        if (String(antes.clp || '') !== String(lote.clp || '')) f0.clp = n0.clp;
        if (String(antes.variedad || '') !== String(lote.variedad || '')) f0.varAbbr = n0.varAbbr;
      } else if (k >= 0) {   // cambió la cantidad: filas nuevas, conservando los pesos ya escritos
        const viejo = G[k].filas;
        nuevo.filas.forEach((r, i) => { const v = viejo[i]; if (v && !r.groupEnd) { r.pesoBruto = v.pesoBruto || ''; r.pesoPalet = v.pesoPalet || ''; } });
        G[k] = nuevo;
      } else {
        let pos = G.findIndex(g => g.li != null && g.li > idx); if (pos < 0) pos = G.length;
        G.splice(pos, 0, nuevo);
      }
    }
  }
  const rows = [];
  G.forEach(g => g.filas.forEach((r, i) => { const o = Object.assign({}, r); if (i === 0) o.li = g.li; else delete o.li; rows.push(o); }));
  rows.forEach((r, i) => { const nx = rows[i + 1]; r.groupEnd = !nx || nx.li != null || !!nx.campo; });
  if (!isFFProv(guide.proveedor)) {   // total de pallets de la guía en el último pallet
    rows.forEach(r => { r.obs = ''; });
    const n = G.reduce((a, g) => a + pfPalletsDeGrupo(g).length, 0);
    if (G.length && n) { const g = G[G.length - 1], ini = rows.length - g.filas.length, k = ini + pfPalletsDeGrupo(g).length - 1; if (rows[k]) rows[k].obs = String(n); }
  }
  guide.hojaPesoOverride = rows.length ? rows : undefined;
  if (!guide.hojaPesoOverride) delete guide.hojaPesoOverride;
}
function drawRotuloPagesForLote(doc, colW, info, isFirstOfDoc){
  info.jabasPorRotulo.forEach((jabas, idx) => {
    if(!(isFirstOfDoc && idx===0)) doc.addPage('a4','landscape');
    const c = info.contador;
    // con contador corrido: el rótulo extra de Valle Azul (de repuesto) sale con el número en blanco
    const d = Object.assign({}, info.dataBase, { jabas,
      palletIndex: c ? (idx < c.reales ? c.offset + idx + 1 : 0) : idx+1,
      totalPallets: c ? c.total : info.dataBase.totalPallets });
    // Mismo bloque de diseño, sin tocar su contenido: se dibuja dos veces (izquierda y
    // derecha) con los MISMOS datos, cada una girada 90°, para que al cortar la hoja A4 a
    // la mitad salgan 2 copias A5 idénticas del mismo rótulo.
    drawRotuloContent(doc, 0, 0, d);
    drawRotuloContent(doc, colW, 0, d);
  });
}
async function generateRotulo(guide, loteIdx){
  const lote = guide.lotes[loteIdx];
  if(!lote) return;
  if(!getProviderPrefix(guide.proveedor)){ alert('No reconozco el proveedor de esta guía para generar rótulos.'); return; }
  if(isNaN(correlBaseDe(guide))){ alert(esGuiaDBIndependiente(guide) ? 'Esta guía de Diamond Bridge tiene EUREKA SUNRISE: su correlativo es independiente. Escríbelo a mano arriba, junto a la guía.' : 'Ingresa primero el correlativo inicial de la guía (arriba, junto a la guía).'); return; }
  const info = buildRotuloDataForLote(guide, loteIdx);
  if(!info){ alert('Este lote no tiene jabas registradas.'); return; }

  try{
    await ensureRotuloFontBytes();
    const { jsPDF } = window.jspdf;
    // Hoja A4 apaisada (echada): una página por pallet, con el MISMO rótulo duplicado en las
    // dos mitades (izquierda y derecha, giradas 90°) — 2 copias idénticas para cortar la hoja
    // por el centro y obtener 2 documentos A5 iguales al diseño original.
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    registerRotuloFont(doc);
    const colW = doc.internal.pageSize.getWidth()/2;
    drawRotuloPagesForLote(doc, colW, info, true);
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rotulo-${info.bigCode}.pdf`;
    try{ info.__g = guide; pfCorrGuardar([info]); }catch(e){}
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    speakRandom(TTS_ROTULOS_OK);
  }catch(err){
    console.error(err);
    alert('No se pudo generar el rótulo: ' + (err&&err.message?err.message:'error desconocido'));
  }
}
// Botón aparte: genera en UN solo PDF los rótulos de TODOS los lotes de la guía, uno tras otro.

// Botón inferior de rótulos: genera en UN solo PDF los rótulos de TODAS las guías escaneadas

//   sus guías (guía 1: 1,2,3 → guía 2: 4,5,6), igual que ya funcionaba por proveedor.
// - POB y Sur Export (y los demás): cada guía usa SU PROPIO correlativo escrito en su campo

  const infos = [];

    infos.forEach((info, i) => drawRotuloPagesForLote(doc, colW, info, !conResumen && i===0));
    const blob = doc.output('blob');

    speakRandom(TTS_ROTULOS_OK);

  }
}

function hojaColOffsets(x, colW){ const off=[x]; for(let i=0;i<colW.length;i++) off.push(off[i]+colW[i]); return off; }
const HOJA_TITLE_H = 22, HOJA_HEADER_H = 18;
const HOJA_FIXED_ROWH = 20; // alto de fila FIJO — NUNCA cambia, ni se agranda ni se achica
function fontFromRowH(rowH, min, max){ return Math.max(min||4, Math.min(max||13, rowH*0.5)); }
function drawGuideBlockFixedRowH(doc, x, y, w, guide, rows, opts){
  opts = opts||{};

  // El nombre del proveedor ya NO se repite en el título de cada bloque (va una sola vez,
  // arriba de toda la hoja o de la columna, en grande) — aquí solo va el número de guía, y
  // en bloques de continuación no va ni siquiera eso.
  const label = opts.label !== undefined ? opts.label : (guide.numero_guia||'');

  doc.text(label, x, cy+11);
  cy += HOJA_TITLE_H;

  const bodyTop = cy;
  const blockH = HOJA_HEADER_H + rows.length*rowH;
  // Sombreado de Peso Bruto / Peso Palet en TODA la columna (encabezado + filas), como pidió
  doc.setFillColor(230,230,230);
  doc.rect(colOff[4], bodyTop, colW[4], blockH, 'F');

  });
  cy += HOJA_HEADER_H;

  let jabasLote = 0;
  rows.forEach(r=>{
    const enBlanco = !r.campo && (r.jabas===''||r.jabas==null) && !r.pesoBruto && !r.correlativoCode;
    if(!enBlanco) jabasLote += parseInt(r.jabas,10) || 0;
    doc.setDrawColor(150); doc.setLineWidth(0.4);
    if(r.campo){
      // Mismo sombreado del encabezado, en el primer cuadrito de "Correlativo" (donde empieza el lote)

    if(r.varAbbr){
      // Mismo sombreado, en la celda de Observación de esa misma fila (primera fila del lote).

    }
    doc.rect(x, cy, w, rowH);
    const vals = [r.lote, r.campo, r.codigo, r.clp, r.pesoBruto, r.pesoPalet, String(r.jabas||''), ''];
    vals.forEach((v,i)=>{
      doc.setDrawColor(150); doc.setLineWidth(0.3);
      doc.line(colOff[i], cy, colOff[i], cy+rowH);
      if(v){
        // "Lote campo" siempre en negrita; "Código" también en negrita cuando es M/S de POB-SurExport
        const isBold = (i===1) || (i===2 && boldCodigo);
        doc.setFont(undefined, isBold?'bold':'normal');
        doc.setFontSize(isBold? Math.min(fontSize+3,13) : fontSize);
        doc.text(String(v), colOff[i]+colW[i]/2, cy+rowH/2+fontSize*0.32, {align:'center'});
      }
    });
    if(r.correlativoCode){
      // Nomenclatura de variedad + guion, apegada a la izquierda DENTRO del cuadrito sombreado,
      // dejando el resto libre para anotar el número a mano (ej "EE- 1256").
      doc.setFont(undefined,'bold'); doc.setFontSize(Math.min(fontSize+1,11));
      doc.text(r.correlativoCode, colOff[0]+3, cy+rowH/2+fontSize*0.32, {align:'left'});
    }
    if(r.varAbbr){
      // Nombre corto de la variedad, en negrita, centrado en el cuadrito sombreado de OBS. —
      // si no entra a ese tamaño (ej. "SEKOYA POP"), se va achicando hasta que quepa.
      doc.setFont(undefined,'bold');
      let vSize = Math.min(fontSize+1,11);
      doc.setFontSize(vSize);
      const maxW = colW[7]-4;
      while(vSize>6 && doc.getTextWidth(r.varAbbr)>maxW){ vSize -= 0.5; doc.setFontSize(vSize); }
      doc.text(r.varAbbr, colOff[7]+colW[7]/2, cy+rowH/2+fontSize*0.32, {align:'center'});
    }
    if(r.obs){
      // Número pequeño, abajo a la izquierda de la celda de Observación
      doc.setFont(undefined,'normal');
      doc.setFontSize(Math.max(4, fontSize-1));
      doc.text(r.obs, colOff[7]+2, cy+rowH-2, {align:'left'});
    }
    if(r.groupEnd){
      if(enBlanco && jabasLote>0){
        const fsJ = Math.max(3.5, fontSize*0.55);
        doc.setFont(undefined,'normal'); doc.setFontSize(fsJ); doc.setTextColor(90);
        doc.text(jabasLote.toLocaleString('es-PE'), colOff[7]+colW[7]/2, cy+rowH/2+fsJ*0.35, {align:'center'});
        doc.setTextColor(0);
      }
      jabasLote = 0;
      doc.setDrawColor(0); doc.setLineWidth(1.6);
      doc.line(x, cy+rowH, x+w, cy+rowH);
    }
    cy += rowH;
  });
  doc.setLineWidth(0.6); doc.setDrawColor(0);
  doc.rect(x, bodyTop, w, blockH);
}
function splitRowsAtGroupBoundary(rows, maxCount, columnaVacia){
  let cut = 0;
  for(let i=0;i<rows.length && i<maxCount;i++){ if(rows[i].groupEnd) cut = i+1; }
  // un lote que no entra ni en una columna vacía se corta donde se pueda (si no, la hoja se llenaba de páginas en blanco)
  if(cut === 0 && columnaVacia) cut = Math.min(maxCount, rows.length);
  return [rows.slice(0,cut), rows.slice(cut)];
}
