function __pfGuiasActuales(){ return guides; }
// Sin parámetro: usa las guías escaneadas. Con una lista: arma la hoja con esas guías (por ejemplo,
// las que salen del Pesaje por fotos, que ya traen su hoja rellenada en "hojaPesoOverride").
async function generateHojaDePeso(listaGuias, nombreArchivo){
  let guides = Array.isArray(listaGuias) ? listaGuias : __pfGuiasActuales();
  { // igual que rótulos y lista: si una guía se escaneó dos veces, va una sola vez
    const vistos = new Set();
    guides = guides.filter(g => { const n = (g.numero_guia||'').trim().toUpperCase(); if(!n) return true; const k = (getProviderPrefix(g.proveedor)||g.proveedor||'') + '|' + n; if(vistos.has(k)) return false; vistos.add(k); return true; });
  }
  if(guides.length===0){ alert('Escanea al menos una guía primero.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    // Siempre horizontal: la hoja se usa por mitades (izquierda/derecha) para poder
    // recortarla; con una sola guía se llena solo la mitad izquierda.
    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 14;
    const GAP = 8; // pequeño espacio entre guía 1 y guía 2 cuando van apiladas en la misma mitad
    const colW = (pageW - margin*3)/2;
    const colH = pageH - margin*2;
    const headerBudget = HOJA_TITLE_H + HOJA_HEADER_H;

    function colX(c){ return c===0 ? margin : margin*2+colW; }

    // Caso: TODAS las guías escaneadas son POB o Sur Export (mezcladas, cualquier cantidad de
    // cada una) → POB SIEMPRE en la columna izquierda, Sur Export SIEMPRE en la derecha.
    const provsLower = guides.map(g => (g.proveedor||'').toLowerCase());
    const isPobStr = s => s.includes('pob');
    const isSrxStr = s => s.includes('surexport') || s.includes('sur export');
    const allPobSrx = guides.length>0 && provsLower.every(p => isPobStr(p) || isSrxStr(p));
    const hasBoth = provsLower.some(isPobStr) && provsLower.some(isSrxStr);
    const isPobSrxMode = allPobSrx && hasBoth;

    // Nombre del proveedor: UNA sola vez arriba de toda la hoja (Family Farms/Diamond
    // Bridge/Valle Azul) o una vez por columna arriba de cada una (POB/Sur Export) — en
    // grande. Ya no se repite también abajo ni en el título de cada bloque de guía.
    // Fecha de turno (3pm-7am): se calcula UNA sola vez por hoja, así que toda la hoja (todas
    // las guías) sale con la misma fecha, aunque se genere ya pasada la medianoche.
    const HOJA_FECHA = getShiftDate();
    function providerStampLabel(proveedor){
      if(isPobStr((proveedor||'').toLowerCase())) return 'POB';
      if(isSrxStr((proveedor||'').toLowerCase())) return 'SUR EXPORT';
      return (proveedor||'').toUpperCase();
    }
    function drawTopBrand(x, w, label){
      if(!label) return;
      const upper = label.toUpperCase();
      // Family Farms y Sur Export tienen logo propio: se dibuja la imagen en vez del texto.
      // Chico y pegado al margen de arriba, sin bajar de la altura del título (para que nunca
      // se meta encima del encabezado ni de las filas de la tabla).
      if(upper.includes('FAMILY FARMS')){
        const logoH = 25, logoW = logoH * (442/105);
        try{ doc.addImage(LOGO_FAMILYFARMS_PNG, 'PNG', x + w/2 - logoW/2, 4, logoW, logoH); return; }catch(e){}
      }
      if(upper.includes('SUR EXPORT') || upper.includes('SUREXPORT')){
        const logoH = 36, logoW = logoH * (356/125);
        try{ doc.addImage(LOGO_SUREXPORT_PNG, 'PNG', x + w/2 - logoW/2, 0, logoW, logoH); return; }catch(e){}
      }
      // POB y Diamond Bridge: el logo que subió el usuario (Personalizar → Logo), en una sola
      // línea: máx. 26 pt de alto y 110 pt de ancho, centrado en el espacio dado.
      const propio = window.pfLogoHoja && window.pfLogoHoja(upper);
      if(propio){
        let lh = 26, lw = lh * propio.w / propio.h;
        const maxW = Math.min(110, w * 0.9);
        if(lw > maxW){ lw = maxW; lh = lw * propio.h / propio.w; }
        try{ doc.addImage(propio.url, 'PNG', x + w/2 - lw/2, Math.max(3, margin + 7 - lh/2), lw, lh); return; }catch(e){}
      }
      doc.setFont('helvetica','bold'); let fs = 16; doc.setFontSize(fs); doc.setTextColor(0);
      while(fs > 9 && doc.getTextWidth(label) > w*0.95){ fs -= 0.5; doc.setFontSize(fs); }   // siempre en una línea
      doc.text(label, x + w/2, margin + 11, { align:'center' });
    }
    function drawTopFecha(x, align){
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(0);
      doc.text(HOJA_FECHA, x, margin + 11, { align: align||'right' });
    }
    // "PACKING SAN FERNANDO" + "RECEPCION DE MATERIA PRIMA" (misma tipografía serif que
    // "HOJA DE PESO" del logo) + el logo, abajo a la derecha del ancho dado (columna o página
    // completa según el caso). Si esa columna tiene muchas filas y el texto quedaría tapado o
    // muy pegado a la tabla, se omite el texto (showText=false) y solo se deja el logo.
    function drawBrandStamp(x, w, showStamp){
      if(!showStamp) return; // si la tabla llega muy abajo, se quita TODO (texto y logo), para
                              // que las filas se vean bien y nada quede tapado.
      const logoW = 73, logoH = logoW * (352/400);
      const logoX = x + w - logoW - 6.5;
      // El texto termina ANTES de donde empieza el logo (con espacio de por medio), para que
      // el logo nunca quede dibujado encima de las letras y se vea "cortado".
      const textRightEdge = logoX - 10;
      doc.setFont('times','bold'); doc.setFontSize(15); doc.setTextColor(0);
      doc.text('PACKING SAN FERNANDO', textRightEdge, pageH - 32, { align:'right' });
      doc.setFont('times','normal'); doc.setFontSize(9);
      doc.text('RECEPCION DE MATERIA PRIMA', textRightEdge, pageH - 18, { align:'right' });
      const wRec = doc.getTextWidth('RECEPCION DE MATERIA PRIMA');
      doc.setFont('helvetica','italic'); doc.setFontSize(6.5); doc.setTextColor(150);
      doc.text('By: José Chávez', textRightEdge - wRec - 10, pageH - 18, { align:'right' });
      doc.setTextColor(0);
      try{
        doc.addImage(LOGO_PROLAN_PNG, 'PNG', logoX, pageH - logoH - 10, logoW, logoH);
      }catch(e){}
    }

    // Número de viaje y nombre del chofer: uno solo por HOJA (no por guía ni por columna),
    // sin importar cuántas guías se escaneen. Viaje arriba a la derecha, chofer abajo a la
    // izquierda (solo el nombre, sin etiqueta).
    let pageViaje = '', pageConductor = '', pageStampProvider = '';
    // Qué tan abajo llegó el contenido dibujado en cada columna de la página actual — para
    // decidir si "PACKING SAN FERNANDO / RECEPCION DE MATERIA PRIMA" cabe sin quedar pegado o
    // tapado por la tabla. Se resetea cada vez que se pasa de página.
    let laneMaxY = { 0: margin, 1: margin };
    // El logo (lo más alto del sello chico) mide ~37pt + 6pt de margen abajo = ~43pt. Se deja
    // un poco de aire extra (45pt) para que nunca quede pegado al borde de la última fila.
    // El logo grande (lo más alto del sello) mide ~64pt + 10pt de margen abajo = ~74pt.
    const STAMP_TEXT_MIN_Y = pageH - 76;
    function trackContentBottom(colIndex, bottomY){
      if(bottomY > laneMaxY[colIndex]) laneMaxY[colIndex] = bottomY;
    }
    function trackFooter(xPos, guide){
      if(!pageViaje && guide.numeroViaje) pageViaje = String(guide.numeroViaje);
      if(!pageConductor && isFFProv(guide.proveedor) && guide.conductor) pageConductor = String(guide.conductor).toUpperCase();
      if(!isPobSrxMode && !pageStampProvider) pageStampProvider = providerStampLabel(guide.proveedor);
    }
    function drawFooter(){
      if(isPobSrxMode){
        // Todo va 2 veces, una por columna: POB siempre a la izquierda, Sur Export a la derecha.
        drawTopBrand(colX(0), colW, 'POB');
        drawTopBrand(colX(1), colW, 'SUR EXPORT');
        drawTopFecha(colX(0) + 82, 'left');
        drawTopFecha(colX(1) + 82, 'left');
        drawBrandStamp(colX(0), colW, laneMaxY[0] < STAMP_TEXT_MIN_Y);
        drawBrandStamp(colX(1), colW, laneMaxY[1] < STAMP_TEXT_MIN_Y);
      } else {
        // Una sola vez, en la esquina inferior DERECHA de toda la hoja — por eso solo importa
        // qué tan llena está la columna derecha (laneMaxY[1]); si la izquierda está muy llena
        // pero la derecha no, el sello no se cruza con nada igual, porque vive del lado derecho.
        // Si hay guía también en la columna derecha, el nombre/logo ya no va al centro de la
        // hoja (chocaría con el número de esa 2ª guía): se corre al espacio libre de la mitad
        // izquierda, entre el número de la 1ª guía y la línea de corte.
        if(laneMaxY[1] > margin) drawTopBrand(margin + colW*0.34, colW*0.58, pageStampProvider);
        else drawTopBrand(margin, pageW - margin*2, pageStampProvider);
        if(pageStampProvider) drawTopFecha(pageW - margin - 55);
        drawBrandStamp(margin, pageW - margin*2, laneMaxY[1] < STAMP_TEXT_MIN_Y);
      }
      if(pageViaje){
        doc.setFont(undefined,'bold'); doc.setFontSize(18); doc.setTextColor(0);
        doc.text(pageViaje, pageW - margin, margin + 12, { align:'right' });
      }
      if(pageConductor){
        doc.setFont(undefined,'normal'); doc.setFontSize(8); doc.setTextColor(0);
        doc.text(pageConductor, margin, pageH - 8);
      }
      pageViaje = ''; pageConductor = ''; pageStampProvider = '';
      laneMaxY = { 0: margin, 1: margin };
    }
    function addPageAndFlushFooter(){ drawFooter(); doc.addPage('a4','landscape'); }

    function paginateLane(guideList){
      const queue = guideList.map(g => ({ guide:g, rows: getHojaRows(g), continuation:false }));
      const pages = [];
      let current = [], y = 0, guard = 0;
      while(queue.length && guard++ < 500){
        const chunk = queue[0];
        if(chunk.rows.length===0){ queue.shift(); continue; }
        const remaining = colH - y;
        const blockH = headerBudget + chunk.rows.length*HOJA_FIXED_ROWH;
        if(blockH <= remaining){
          current.push(chunk);
          y += blockH + GAP;
          queue.shift();
          continue;
        }
        const maxRowsFit = Math.max(0, Math.floor((remaining-headerBudget)/HOJA_FIXED_ROWH));
        if(maxRowsFit>0){
          const [a,b] = splitRowsAtGroupBoundary(chunk.rows, maxRowsFit, y === 0 && current.length === 0);
          if(a.length){
            current.push({ guide:chunk.guide, rows:a, continuation:chunk.continuation });
            queue[0] = b.length ? { guide:chunk.guide, rows:b, continuation:true } : null;
            if(!queue[0]) queue.shift();
          }
        }
        pages.push(current);
        current = []; y = 0;
      }
      if(current.length) pages.push(current);
      if(pages.length===0) pages.push([]);
      return pages;
    }
    function drawLane(colIndex, chunks){
      let y = margin;
      chunks.forEach((chunk) => {
        const opts = chunk.continuation ? { label:'' } : {};
        drawGuideBlockFixedRowH(doc, colX(colIndex), y, colW, chunk.guide, chunk.rows, opts);
        trackFooter(colX(colIndex), chunk.guide);
        y += headerBudget + chunk.rows.length*HOJA_FIXED_ROWH + GAP;
        trackContentBottom(colIndex, y);
      });
    }

    if(allPobSrx && hasBoth){
      const pobGuides = guides.filter((g,i) => isPobStr(provsLower[i]));
      const srxGuides = guides.filter((g,i) => isSrxStr(provsLower[i]));
      const pobPages = paginateLane(pobGuides);
      const srxPages = paginateLane(srxGuides);
      const totalPages = Math.max(pobPages.length, srxPages.length);
      for(let p=0; p<totalPages; p++){
        if(p>0) addPageAndFlushFooter();
        drawLane(0, pobPages[p]||[]);
        drawLane(1, srxPages[p]||[]);
      }
    } else {
      // Cola de "bloques" a colocar. Todas las guías se apilan de corrido en la columna izquierda
      // (con un pequeño espacio entre cada una); solo se pasa a la columna derecha —o a una hoja
      // nueva si la derecha también se llena— cuando de verdad ya no entra más, y siempre cortando
      // en el cierre de un lote completo (nunca a la mitad de uno). Tamaño de fila siempre fijo.
      const queue = guides.map(g => ({ guide:g, rows: getHojaRows(g), continuation:false }));
      let col = 0, y = margin;
      let guard = 0;
      while(queue.length && guard++ < 500){
        const chunk = queue[0];
        if(chunk.rows.length===0){ queue.shift(); continue; }
        const remaining = colH - (y - margin);
        const blockH = headerBudget + chunk.rows.length*HOJA_FIXED_ROWH;
        // El número de guía va una sola vez, en el primer bloque de esa guía; si sus lotes se
        // corren a otra columna u hoja, ese bloque de continuación no lleva ningún título.
        const opts = chunk.continuation ? { label:'' } : {};

        if(blockH <= remaining){
          drawGuideBlockFixedRowH(doc, colX(col), y, colW, chunk.guide, chunk.rows, opts);
          trackFooter(colX(col), chunk.guide);
          y += blockH + GAP;
          trackContentBottom(col, y);
          queue.shift();
          continue;
        }
        const maxRowsFit = Math.max(0, Math.floor((remaining - headerBudget) / HOJA_FIXED_ROWH));
        if(maxRowsFit > 0){
          const [rowsA, rowsB] = splitRowsAtGroupBoundary(chunk.rows, maxRowsFit, y === margin);
          if(rowsA.length){
            drawGuideBlockFixedRowH(doc, colX(col), y, colW, chunk.guide, rowsA, opts);
            trackFooter(colX(col), chunk.guide);
            trackContentBottom(col, y + headerBudget + rowsA.length*HOJA_FIXED_ROWH);
            queue[0] = rowsB.length ? { guide: chunk.guide, rows: rowsB, continuation: true } : null;
            if(!queue[0]) queue.shift();
          }
        }
        // La columna actual queda agotada: pasar a la derecha, o a una hoja nueva si ya estábamos ahí.
        col++; y = margin;
        if(col>1){ addPageAndFlushFooter(); col = 0; }
      }
    }
    drawFooter(); // pie de la última página

    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombreArchivo || `hoja-de-peso-${guides.map(g=>g.numero_guia||'x').join('-')}.pdf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    speakRandom(TTS_HOJA_OK);
  }catch(err){
    console.error(err);
    alert('No se pudo generar la hoja de peso: ' + (err&&err.message?err.message:'error desconocido'));
  }
}
/* ============================================================
   LISTA DE PESAJE (A5, duplicada en A4 echada como los rótulos)
   Todo lo de la hoja de peso menos los pesos, con un cuadrito por pallet para
   ir marcando lo pesado y espacio para observación.
   ============================================================ */
async function generateListaPesaje(){
  const vistos = new Set(), lista = [];
  guides.forEach(g => {
    const clave = (getProviderPrefix(g.proveedor)||g.proveedor||'') + '|' + (g.numero_guia||'').trim().toUpperCase();
    if((g.numero_guia||'').trim() && vistos.has(clave)) return;
    vistos.add(clave); lista.push(g);
  });
  if(!lista.length){ alert('Escanea al menos una guía primero.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    const HALF = doc.internal.pageSize.getWidth()/2, PH = doc.internal.pageSize.getHeight();
    const M = 5, W = HALF - M*2, BOTTOM = PH - 4;
    // columnas: correlativo | lote | código | clp | variedad | jabas | n° | observación | ✓ (al final)
    const COLS = [['CORRELATIVO',23],['LOTE',16],['CÓD.',14],['CLP',9],['VARIEDAD',21],['JABAS',11],['N°',9],['OBS.',0],['',8]];
    COLS[7][1] = W - COLS.reduce((a,c)=>a+c[1],0);
    const X = []; { let x=M; COLS.forEach(c=>{ X.push(x); x+=c[1]; }); X.push(x); }
    const both = fn => { fn(0); fn(HALF); };
    const sinSoc = s => String(s||'').replace(/\b(S\.?A\.?C\.?|E\.?I\.?R\.?L\.?|S\.?R\.?L\.?|S\.?A\.?)\b\.?/gi,'').replace(/\s+/g,' ').trim().toUpperCase();
    const nomProv = p => { const s=(p||'').toLowerCase(); return s.includes('pob')?'POB':s.includes('surexport')||s.includes('sur export')?'SUR EXPORT':sinSoc(p); };
    // datos de cada guía (lotes = filas de la hoja de peso, sin la fila en blanco)
    const bloques = lista.map(g => {
      const grupos = []; let act = [];
      getHojaRows(g).forEach(r => {
        const vacia = r.campo==='' && r.codigo==='' && r.clp==='' && (r.jabas===''||r.jabas==null) && !r.pesoBruto && !r.correlativoCode && !r.varAbbr;
        if(r.groupEnd){ if(!vacia) act.push(r); if(act.length) grupos.push(act); act = []; return; }
        if(r.campo==='' && r.codigo==='' && r.clp==='' && (r.jabas===''||r.jabas==null) && !r.correlativoCode && !r.varAbbr && !act.length) return;
        act.push(r);
      });
      if(act.length) grupos.push(act);
      const nPal = grupos.reduce((a,gr)=>a+gr.length,0);
      const nJab = grupos.reduce((a,gr)=>a+gr.reduce((b,r)=>b+(parseInt(r.jabas,10)||0),0),0);
      return { g, grupos, nPal, nJab };
    });
    // proveedor centrado arriba (si hay varios, juntos)
    const titulo = [...new Set(lista.map(g=>nomProv(g.proveedor)).filter(Boolean))].join('  ·  ') || 'LISTA DE PESAJE';
    const TOP = 10.5;                       // debajo del título
    const SUB = 5, HEAD = 4.6, GAP = 1.8;   // subtítulo de guía, cabecera de tabla, espacio entre guías
    const filasTot = bloques.reduce((a,b)=>a+b.nPal,0);
    const fijo = bloques.length*(SUB+HEAD) + (bloques.length-1)*GAP;
    // alto de fila: lo justo para que TODO entre en una sola hoja (entre 3.4 y 6.4 mm)
    let ROW = (BOTTOM - TOP - fijo) / Math.max(1, filasTot);
    ROW = Math.max(3.4, Math.min(6.4, ROW));
    const k = Math.min(1, ROW/6);           // escala de letras según el alto de fila
    const fs = n => Math.max(5.2, n*k);
    const fecha = getShiftDate();
    let y = 0;
    function encabezadoHoja(primera){
      if(!primera) doc.addPage('a4','landscape');
      both(o => {
        doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.setFontSize(titulo.length>28?11:13);
        doc.text(titulo, o+HALF/2, 7, {align:'center'});
        doc.setFont('helvetica','normal'); doc.setFontSize(7);
        doc.text(fecha, o+HALF-M, 7, {align:'right'});
      });
      y = TOP;
    }
    function cabeceraTabla(){
      both(o => {
        doc.setFillColor(30,30,30); doc.rect(o+X[0], y, W, HEAD, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(255);
        COLS.forEach((c,i)=>{ if(c[0]) doc.text(c[0], o+X[i]+c[1]/2, y+HEAD/2+1, {align:'center'}); });
        doc.setDrawColor(255); doc.setLineWidth(0.25); const q=Math.min(3.2,HEAD-1.2); doc.rect(o+X[8]+(COLS[8][1]-q)/2, y+(HEAD-q)/2, q, q);
        doc.setTextColor(0);
      });
      y += HEAD;
    }
    encabezadoHoja(true);
    bloques.forEach((b, gi) => {
      const g = b.g;
      if(gi>0) y += GAP;
      if(y + SUB + HEAD + ROW*2 > BOTTOM) encabezadoHoja(false); // solo si de verdad no entra
      both(o => {
        doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.setFontSize(9);
        const izq = (g.numero_guia ? `Guía ${g.numero_guia}` : 'Guía') + (bloques.length>1 && new Set(lista.map(x=>nomProv(x.proveedor))).size>1 ? `  ${nomProv(g.proveedor)}` : '');
        doc.text(izq, o+M, y+3.6);
        doc.setFont('helvetica','normal'); doc.setFontSize(7);
        doc.text([g.numeroViaje ? `Viaje ${g.numeroViaje}` : '', `${b.nPal} pallets`, `${b.nJab.toLocaleString('es-PE')} jabas`].filter(Boolean).join('  ·  '), o+HALF-M, y+3.6, {align:'right'});
      });
      y += SUB;
      cabeceraTabla();
      b.grupos.forEach(gr => {
        const variedad = gr[0].varAbbr || '';
        gr.forEach((r, kk) => {
          if(y + ROW > BOTTOM){ encabezadoHoja(false); cabeceraTabla(); }
          const prim = kk===0, cy = y + ROW/2 + ROW*0.17;
          both(o => {
            if(prim && r.correlativoCode){ doc.setFillColor(225,225,225); doc.rect(o+X[0], y, COLS[0][1], ROW, 'F'); }
            doc.setDrawColor(160); doc.setLineWidth(0.12);
            for(let i=0;i<X.length;i++) doc.line(o+X[i], y, o+X[i], y+ROW);
            doc.line(o+X[0], y+ROW, o+X[X.length-1], y+ROW);
            // cuadrito para marcar, al final
            const q = Math.min(3.6, ROW-1); doc.setDrawColor(0); doc.setLineWidth(0.3);
            doc.rect(o+X[8]+(COLS[8][1]-q)/2, y+(ROW-q)/2, q, q);
            doc.setTextColor(0);
            if(prim){
              doc.setFont('helvetica','bold'); doc.setFontSize(fs(8.5));
              if(r.correlativoCode) doc.text(String(r.correlativoCode), o+X[0]+1.2, cy);
              doc.setFontSize(fs(9.5)); doc.text(String(r.campo||''), o+X[1]+COLS[1][1]/2, cy, {align:'center'});
              doc.setFontSize(fs(8)); doc.text(String(r.codigo||''), o+X[2]+COLS[2][1]/2, cy, {align:'center'});
              doc.setFont('helvetica','normal'); doc.text(String(r.clp||''), o+X[3]+COLS[3][1]/2, cy, {align:'center'});
              doc.setFont('helvetica','bold'); doc.setFontSize(fs(variedad.length>9?6.5:7.5));
              doc.text(variedad, o+X[4]+COLS[4][1]/2, cy, {align:'center'});
            }
            doc.setFont('helvetica','bold'); doc.setFontSize(fs(8.5));
            doc.text(String(r.jabas??''), o+X[5]+COLS[5][1]/2, cy, {align:'center'});
            doc.setFont('helvetica','normal'); doc.setFontSize(fs(7));
            doc.text(`${kk+1}/${gr.length}`, o+X[6]+COLS[6][1]/2, cy, {align:'center'});
          });
          y += ROW;
        });
        both(o => { doc.setDrawColor(0); doc.setLineWidth(0.45); doc.line(o+X[0], y, o+X[X.length-1], y); });
      });
    });
    // línea de corte al centro
    const total = doc.internal.getNumberOfPages();
    for(let pg=1; pg<=total; pg++){
      doc.setPage(pg);
      doc.setDrawColor(190); doc.setLineWidth(0.2);
      if(doc.setLineDashPattern) doc.setLineDashPattern([2,2],0);
      doc.line(HALF, 3, HALF, PH-3);
      if(doc.setLineDashPattern) doc.setLineDashPattern([],0);
    }
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const nums = lista.map(g => g.numero_guia).filter(Boolean);
    a.href = url; a.download = nums.length ? `Lista de pesaje ${nums.join(' ')}.pdf` : 'Lista de pesaje.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(err){
    console.error(err);
    alert('No se pudo generar la lista de pesaje: ' + (err&&err.message?err.message:'error desconocido'));
  }
}
/* ============================================================
   RESUMEN DE LOTES (A5 como el rótulo, duplicado en A4 echada):
   "LT2 › 3", "LT13 › 4"… en letras grandes. Si un lote se repite, se le
   agrega la nomenclatura de su variedad (LT1EU, LT1FB).
   ============================================================ */
// Memoria de correlativos impresos en el turno: cada vez que se imprimen rótulos se guardan sus
// correlativos (uno solo por código, aunque se reimprima). La primera hoja del PDF de rótulos
// muestra TODO lo acumulado del turno, por proveedor y de menor a mayor.
const PF_CORR_MEM = 'pf7:corrImp:';
try{ if(localStorage.getItem('pf7:corrImpReset43') !== '1'){ Object.keys(localStorage).filter(k => k.startsWith(PF_CORR_MEM)).forEach(k => localStorage.removeItem(k)); localStorage.setItem('pf7:corrImpReset43','1'); } }catch(e){}
function pfCorrClave(){ return PF_CORR_MEM + getShiftDate(); }
function pfCorrLeerLocal(clave){ try{ const v = JSON.parse(localStorage.getItem(clave || pfCorrClave()) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
// lo de este equipo + lo que llegó de las otras PCs (carpeta compartida); si un código está en los dos, vale el de aquí
function pfCorrLeer(clave){
  clave = clave || pfCorrClave();
  const loc = pfCorrLeerLocal(clave), rem = ((window.pfSyncRemoto && window.pfSyncRemoto.corr) || {})[clave] || [];
  const fk = r => r.lk ? String(r.guia||'').replace(/\s/g,'').toUpperCase() + '#' + r.lk : '';
  const ya = new Set(loc.map(r => r.cod)), gl = new Set(loc.map(fk).filter(Boolean));
  return loc.concat(rem.filter(r => r && r.cod && !ya.has(r.cod) && !(fk(r) && gl.has(fk(r))) && (ya.add(r.cod), true)));
}
// ---- correlativo saltado / repetido ----
function pfCorrNum(c){ const m = String(c||'').match(/^(.*?)(\d+)$/); return m ? { serie:m[1].replace(/-$/,'').toUpperCase(), n:+m[2], ancho:m[2].length } : null; }
function pfCorrCod(serie, n, ancho){ return pfCorrGuion(serie + String(n).padStart(ancho, '0')); }
const PF_CORR_HUECO_MAX = 40;   // saltos más grandes que esto se toman como otra tanda (no se avisa)
function pfCorrHuecos(lista, soloSeries){
  const por = {};
  lista.forEach(r => { const x = pfCorrNum(r.cod); if(!x) return; if(soloSeries && !soloSeries.has(x.serie)) return; (por[x.serie] = por[x.serie] || { ancho:x.ancho, ns:new Set() }).ns.add(x.n); });
  const out = [];
  Object.entries(por).forEach(([serie, o]) => { const ns = [...o.ns].sort((a, b) => a - b);
    for(let i = 1; i < ns.length; i++){ const d = ns[i] - ns[i-1]; if(d > 1 && d - 1 <= PF_CORR_HUECO_MAX) out.push({ serie, desde:ns[i-1] + 1, hasta:ns[i] - 1, ancho:o.ancho }); } });
  return out;
}
function pfCorrHuecoTxt(h){ return h.desde === h.hasta ? `Falta ${pfCorrCod(h.serie, h.desde, h.ancho)}` : `Faltan ${pfCorrCod(h.serie, h.desde, h.ancho)} a ${pfCorrCod(h.serie, h.hasta, h.ancho)} (${h.hasta - h.desde + 1})`; }
// después de la fila i (ya ordenadas), ¿hay un salto hasta el siguiente de la misma serie?
function pfCorrHuecoTras(filas, i){
  return null;   // ya no se marcan los correlativos faltantes en pantalla
  const a = pfCorrNum(filas[i].cod); if(!a) return null;
  let sig = null; for(let j = i + 1; j < filas.length; j++){ const b = pfCorrNum(filas[j].cod); if(b && b.serie === a.serie){ sig = b; break; } }
  if(!sig) return null; const d = sig.n - a.n;
  return d > 1 && d - 1 <= PF_CORR_HUECO_MAX ? { serie:a.serie, desde:a.n + 1, hasta:sig.n - 1, ancho:a.ancho } : null;
}
function pfCorrNormLote(l){ return String(l||'').toUpperCase().replace(/[\s\-]+/g,''); }
function pfCorrNombreProv(p){ return String(p||'').replace(/\b(S\.?A\.?C\.?|E\.?I\.?R\.?L\.?|S\.?R\.?L\.?|S\.?A\.?)\b\.?/gi,'').replace(/\bPER[UÚ]\b/gi,'').replace(/\s+/g,' ').trim().toUpperCase() || 'SIN PROVEEDOR'; }
function pfCorrGuardar(infos){
  setTimeout(() => { try{ pfPintarCorrPanel(); }catch(e){} try{ pf2RenderHist(); }catch(e){} }, 0);
  const guiasImp = new Set(); infos.forEach(inf => { if(inf && inf.__g) guiasImp.add(inf.__g); });
  guiasImp.forEach(pfCorrAnclarGuia);
  if(guiasImp.size) saveCorrelativoAutoState();
  const lista = pfCorrLeerLocal();
  // todo lo impreso antes (este turno y los anteriores guardados, de esta PC y de las otras)
  const antes = [];
  try{ const claves = new Set(Object.keys(localStorage).filter(k => k.startsWith(PF_CORR_MEM)).concat(Object.keys((window.pfSyncRemoto && window.pfSyncRemoto.corr) || {})));
    claves.forEach(k => pfCorrLeer(k).forEach(r => antes.push(r))); }catch(e){}
  const repetidos = [], series = new Set(), enTanda = {};
  infos.forEach(inf => {
    if(!inf || !inf.bigCode) return;
    const g = inf.__g || {};

// Correlativos impresos del turno, igual que la hoja de antes, pero en pantalla debajo de los lotes
function parseEsNumber(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim();
  if(!s) return 0;
  // Detecta solo el formato en vez de asumir uno: "6,272.98" (coma miles, punto decimal) vs
  // "1.672,49" (punto miles, coma decimal) — el separador que aparece MÁS A LA DERECHA es el
  // decimal; si solo hay uno de los dos, se decide por cuántos dígitos quedan después.
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    s = lastComma>lastDot ? s.replace(/\./g,'').replace(',', '.') : s.replace(/,/g,'');
  } else if(lastComma>-1){
    const commaCount = (s.match(/,/g)||[]).length, intC = s.slice(0,lastComma).replace(/\D/g,'').length;
    // "27565,539" (4+ dígitos antes) es decimal; "11,544" o "1,234,567" son miles
    s = ((s.length-lastComma-1)!==3 || (commaCount===1 && intC>=4)) && commaCount===1 ? s.replace(',', '.') : s.replace(/,/g,'');
  } else if(lastDot>-1){
    const dotCount = (s.match(/\./g)||[]).length;
    const digitsAfter = s.length-lastDot-1;
    // Un solo punto con EXACTAMENTE 3 dígitos después (ej. "11.544") es separador de miles, no
    // decimal — un peso real casi nunca viene con 3 decimales. Con 1 o 2 dígitos sí es decimal
    // de verdad (ej. "650.4"). Con más de un punto, siempre son de miles (ej. "1.234.567").
    const intD = s.slice(0,lastDot).replace(/\D/g,'').length;
    // "27565.539" (4+ dígitos antes del punto) es decimal aunque tenga 3 decimales
    if(dotCount>1 || (digitsAfter===3 && intD<=3)) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// Código de proveedor a partir de lo que sea que se escriba: "ff", "Ff", "F.F.", "family", "srx", "sur export"...
function ekCodigoProveedor(s){
  const c = ekCompacto(s);
  if (!c) return '';
  const alias = ekReglas().proveedorAlias || {};
  for (const k of Object.keys(alias)) if (ekCompacto(k) === c) return ekCodigoProveedor(alias[k]) || String(alias[k]).toUpperCase();
  if (['FF','FAMILYFARMS','FAMILY','FAMILYFARM','FAMILYFARMSPERU'].includes(c) || c.startsWith('FAMILYFARM')) return 'FF';
  if (['DB','DIAMOND','DIAMONDBRIDGE'].includes(c) || c.startsWith('DIAMOND')) return 'DB';
  if (['SRX','SR','SUREXPORT','SUR','SE'].includes(c) || c.startsWith('SUREXPORT')) return 'SRX';
  if (['POB','CN'].includes(c) || /^POB/.test(c)) return 'POB';
  if (['VA','VALLEAZUL','VALLE'].includes(c) || c.startsWith('VALLEAZUL')) return 'VA';
  if (['AF','ALLPA','ALLPAFARMS'].includes(c) || c.startsWith('ALLPA')) return 'AF';

    if (c.length >= 4 && p.claves.some(k => k.replace(/[^A-Z0-9]/g, '').startsWith(c))) return p.codigo;

/* ---------- Proveedor de la guía ---------- */
function ekDetectarProveedor(texto){
  // El remitente va en el encabezado: se busca primero en los primeros renglones; si no, en todo el texto.
  const lin = ekNorm(texto).split('\n');
  // en el encabezado se ignoran renglones de productor, destinatario, transportista, etc. (no son el remitente)
  const otros = /PRODUCTOR|DESTINATARIO|TRANSPORTISTA|CLIENTE|COMPRADOR|LLEGADA|CONDUCTOR/;
  const cab = ekDetectarEn(lin.slice(0, 12).filter(L => !otros.test(L)).join('\n'));

function ekDetectarEn(T0){
  const T = T0, C = T.replace(/[^A-Z0-9]/g, '');

  let mejor = null;

    const i = T.indexOf(p.ruc);
    if (i >= 0 && (!mejor || i < mejor.i)) mejor = { p, i };

    const verde = /VERD|VDE|VDR|V E R D|COLOR\s*V/.test(resto) || /COLOR\s*VERD/.test(b);
    const jarrasM = b.match(/(\d+)\s*JARRAS/);
    const clpM = b.match(/\bCLP\s*[:;.\-]?\s*(\d{3}-\d{5}-\d{2}|\d{1,3})\b/);
    lotes.push({
      lote: lm ? lm[1].trim() : '',
      variedad: vm ? vm[1].trim() : '',
      jabas: jm ? ekEntero(jm[1]) : 0,
      pallets_fila: pm && /\d/.test(pm[1]) ? parseInt(pm[1], 10) : 0,
      es_jarras: !!jarrasM, num_jarras: jarrasM ? parseInt(jarrasM[1], 10) : 0,
      clp: clpM ? clpM[1] : '', verde,
    });
  });
  return lotes;
}

function ekLotesPobSrx(T){
  // "ARANDANOS FRESCOS - VARIEDAD SEKOYA POP : M1 S1 CLP:01 - 240 JABAS - 1"
  const re = /VAR[I1]?EDA?D?\s+([A-Z][A-Z \-]*?)\s*[:;]\s*([A-Z0-9][A-Z0-9 \-]*?)(?:\s*CLP\s*[:;.\-]?\s*(\d+))?\s*-\s*(\d[\d,.]*)\s*(JA[BV]AS?|JARRAS?)([^\n]{0,80})/g;
  const lotes = []; let m;
  while ((m = re.exec(T))) {
    const unidad = m[5], resto = m[6] || '';
    const renglon = m[0];
    const esJ = /JARRA/.test(renglon);
    let jabas = 0, jarras = 0;
    if (/JARRA/.test(unidad)) {
      jarras = ekEntero(m[4]);
      const jb = renglon.match(/(\d[\d,.]*)\s*JA[BV]AS/); jabas = jb ? ekEntero(jb[1]) : 0;
    } else {
      jabas = ekEntero(m[4]);
      const jr = renglon.match(/(\d[\d,.]*)\s*JARRAS/); jarras = jr ? ekEntero(jr[1]) : 0;
    }
    const pal = resto.match(/^\s*-\s*(\d+|-)/);
    const cal = renglon.match(/(\d+\s*P\s*CAL\s*\d+|CAL\s*\d+)/);
    const kg = renglon.match(/(\d[\d,.]*)\s*KG/);
    lotes.push({
      lote: ekLoteMS(m[2]), variedad: m[1].trim(), clp: m[3] || '',
      jabas, es_jarras: esJ, num_jarras: jarras,
      jarras_jabas_calc: esJ && !jabas && jarras ? true : false,
      pallets_fila: pal && /\d/.test(pal[1]) ? parseInt(pal[1], 10) : 0,
      calibre: cal ? cal[1].replace(/\s+/g, ' ') : '', peso_kg: kg ? ekNumero(kg[1]) : 0,
    });
  }
  // Jarras sin jabas escritas: 12 jarras por jaba (regla de EUREKA)
  lotes.forEach(l => { if (l.es_jarras && !l.jabas && l.num_jarras) l.jabas = Math.round(l.num_jarras / 12); });
  // Mismo lote en varios renglones: se suman
  const out = [];
  lotes.forEach(l => {
    const k = `${l.lote}|${ekCompacto(l.variedad)}|${l.es_jarras ? 'J' : 'B'}`;
    const prev = out.find(o => o._k === k);
    if (prev) { prev.jabas += l.jabas; prev.num_jarras += l.num_jarras; prev.pallets_fila += l.pallets_fila; prev.peso_kg += l.peso_kg; }
    else out.push(Object.assign({ _k:k }, l));
  });
  out.forEach(o => delete o._k);
  return out;
}

function ekLotesFF(T){
  const lineas = T.split('\n');
  const lotes = [];
  const reCod = /\b(\d{6})\s*M\s*(\d{1,3})\b/;
  const reFila = /(\d{1,2})\s*\(\s*([\d.,]+)\s*\)\s+([\d,]+(?:\.\d+)?)\s+([\d,]+(?:\.\d+)?)/;
  const reVar = /(EUREKA\s+SUNRISE|EUREKA\s+SUNSET|EUREKA\s+GOLD|EUREKA\s+MAXX|FIRST\s+BLUSH|EUREKA|SUNRISE|SUNSET|GOLD|MAXX|BLUSH)/;
  for (let i = 0; i < lineas.length; i++) {
    const L = lineas[i]; const cm = L.match(reCod);
    if (!cm) continue;
    const ventana = [L, lineas[i + 1] || '', lineas[i + 2] || ''].join(' ');
    const fm = ventana.match(reFila);
    let jabas = 0, kg = 0, pal = 0;
    if (fm) { pal = parseInt(fm[1], 10) || 0; jabas = Math.round(pfNum(fm[3])); kg = pfNum(fm[4]); }
    else {
      // Sin el "12(491.5)": se toman los números después del código y se elige el que da ~2.5 kg por jaba
      const nums = (ventana.slice(ventana.indexOf(cm[0]) + cm[0].length).match(/\d[\d,]*(?:\.\d+)?/g) || []).map(pfNum).filter(n => n > 0);
      for (let a = 0; a < nums.length - 1 && !jabas; a++) {
        const j = nums[a], k = nums[a + 1];
        if (Number.isInteger(j) && j > 0 && k / j > 1.6 && k / j < 3.6) { jabas = j; kg = k; }
      }
      if (!jabas && nums.length) jabas = Math.round(nums.find(n => Number.isInteger(n)) || 0);
    }
    // Variedad = palabras de la DESCRIPCION (entre el código y el primer número), sin "ARANDANO/GRANEL/FRESCO"
    const tras = ventana.slice(ventana.indexOf(cm[0]) + cm[0].length);
    const desc = (tras.match(/^[^\d]*/) || [''])[0].replace(/\b(ARANDANOS?|GRANEL|FRESCOS?|BLUEBERR(Y|IES)|DE|EN|KGR?|KG)\b/g, ' ').replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
    const vm = desc ? [desc, desc] : ventana.replace(reCod, ' ').match(reVar);
    const clp = (ventana.match(/\b(\d{3}-\d{5}-\d{2})\b/) || [])[1] || '';
    lotes.push({ lote: cm[2], variedad: vm ? vm[1].replace(/\s+/g, ' ') : '', jabas, peso_kg: kg, pallets_fila: pal, clp, es_jarras:false, num_jarras:0 });
  }
  return lotes;
}

function ekLotesVA(T){
  const re = /VAR[I1]?EDA?D?\s+([A-Z][A-Z ]*?)\s*-\s*(\d[\d,.]*)\s*JA[BV]AS?\s*-\s*(\d+)\s*PALLETS?\s*-\s*L[O0]TE\s*([A-Z0-9]+)/g;
  const lotes = []; let m;
  while ((m = re.exec(T))) lotes.push({ lote:m[4], variedad:m[1].trim(), jabas:ekEntero(m[2]), pallets_fila:parseInt(m[3], 10) || 0, clp:'', es_jarras:false, num_jarras:0 });
  return lotes;
}

function ekLotesGenerico(T){
  const lotes = [];
  T.split('\n').forEach(line => {
    if (!/JA[BV]AS|JARRAS/.test(line)) return;
    const jr = parseJarrasEk(line);
    if (!jr.cantidad && !jr.jarras_cantidad) return;
    const loteM = line.match(/L[O0]TE\s*[:\-]?\s*([A-Z0-9\- ]{1,20}?)(?=\s{2,}|\s+VAR|\s+-|$)/);
    const varM = line.match(/VAR[I1]?EDA?D?\s*[:\-]?\s*([A-Z ]{2,30}?)(?=\s*[:\-]|\s{2,}|$)/);
    const split = splitClpFromLote(loteM ? loteM[1] : '');
    lotes.push({ lote: split.lote || '', variedad: varM ? varM[1].trim() : '', jabas: jr.cantidad, clp: split.clp,
      es_jarras: jr.jarras, num_jarras: jr.jarras_cantidad, pallets_fila:0 });
  });
  return lotes;
}
function parseJarrasEk(line){
  const jabasM = line.match(/(\d[\d,.]*)\s*JA[BV]AS/), jarrasM = line.match(/(\d[\d,.]*)\s*JARRAS/);
  return { jarras: /JARRAS/.test(line), cantidad: jabasM ? ekEntero(jabasM[1]) : 0, jarras_cantidad: jarrasM ? ekEntero(jarrasM[1]) : 0 };
}

/* ---------- Lectura completa de una guía a partir de su texto ---------- */
function ekLeerTextoGuia(texto, nombreArchivo, codigoPestana, codigoForzado){
  const T = ekNorm(texto);
  const avisos = [];
  let codigo = codigoForzado || ekDetectarProveedor(T);
  if (!codigo) { codigo = codigoPestana || ''; if (codigo) avisos.push({ tipo:'info', txt:`No encontré el proveedor en la guía; uso la pestaña ${codigo}.` }); }
  const prov = ekProvPorCodigo(codigo);
  let crudos = [];
  if (codigo === 'DB') crudos = ekLotesDB(T);
  else if (codigo === 'POB' || codigo === 'SRX') crudos = ekLotesPobSrx(T);
  else if (codigo === 'FF') crudos = ekLotesFF(T);
  else if (codigo === 'VA') crudos = ekLotesVA(T);
  if (!crudos.length) crudos = ekLotesGenerico(T);

  const proveedor = prov ? prov.nombre : 'Desconocido';
  const lotes = normalizeExtractedLotes(crudos, proveedor).map((l, i) => {
    const c = crudos[i] || {};
    l.variedad = ekCanonVariedad(l.variedad, codigo);
    if (codigo === 'POB' || codigo === 'SRX') l.lote = ekLoteMS(l.lote);
    if (c.verde) l.verde = true;
    if (c.calibre) l.calibre = c.calibre;
    if (c.jarras_jabas_calc) l._jabasDeJarras = true;
    return l;
  });
  const clpG = ekClpGlobal(T);
  if (clpG) lotes.forEach(l => { if (!String(l.clp || '').trim()) l.clp = clpG; });
  const placas = ekPlacas(T);
  const numeroViaje = pfViajeDe(T) || pfViajeDe(nombreArchivo || '') || pfViajeFinal(nombreArchivo || '');
  return {
    codigo, proveedor, numero_guia: ekNumeroGuia(T), fecha: ekFechaGuia(T), conductor: ekConductor(T),
    placa: placas[0] || '', carreta: placas[1] || '', numeroViaje,
    totalJabasGuia: ekTotal(T, 'jabas'), totalPalletsGuia: ekTotal(T, 'pallets'),
    lotes, avisos,
  };
}

/* ============================================================
   ALMACENAMIENTO (IndexedDB, con respaldo en memoria)
   ============================================================ */
const EKDB = (() => {
  let dbp = null; const mem = new Map();
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const rq = indexedDB.open('eureka', 1);
        rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function op(store, mode, fn){
    const d = await open();
    if (!d) return fn(null);
    return new Promise((res) => { try { const tx = d.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(undefined); } catch (e) { res(undefined); } });
  }
  return {
    async get(store, k){ const d = await open(); if (!d) return mem.get(store + k); return op(store, 'readonly', s => s.get(k)); },
    async set(store, k, v){ const d = await open(); if (!d) { mem.set(store + k, v); return; } return op(store, 'readwrite', s => s.put(v, k)); },
    async del(store, k){ const d = await open(); if (!d) { mem.delete(store + k); return; } return op(store, 'readwrite', s => s.delete(k)); },
  };
})();

function ekCapLote(g, l){ return (l.jarras || l.verde) ? 50 : (g.capacity || capacity); }

const _ekBlobs = new Map();
(function(){
  const oc = URL.createObjectURL.bind(URL);
  URL.createObjectURL = (b) => { const u = oc(b); try { if (b instanceof Blob) _ekBlobs.set(u, b); } catch (e) {} return u; };
  let dl, tried = false;
  async function getDl(){ if (tried) return dl; tried = true; try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dl = null; } return dl; }
  if (window.claude && window.claude.use) getDl();
  const orig = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    const a = this;
    if (a.download && /^(blob:|data:)/.test(a.href || '') && window.claude && window.claude.use) {
      const name = a.download, href = a.href;
      (async () => {
        const d = await getDl();
        if (!d) { orig.call(a); return; }
        try {
          let blob = _ekBlobs.get(href);
          if (!blob && href.startsWith('data:')) blob = await (await fetch(href)).blob();

const EK_HIST = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
const _hist = []; let _skipPop = 0;
function ekPush(tag){ if (!EK_HIST) return; try { history.pushState({ ek: tag }, ''); _hist.push(tag); } catch (e) {} }
function ekPopHist(tag){ if (!EK_HIST) return; const i = _hist.lastIndexOf(tag); if (i < 0) return; _hist.splice(i, 1); _skipPop++; try { history.back(); } catch (e) { _skipPop--; } }
function ekOpen(id, html, opts = {}){

/* ============================================================
   VALIDACIÓN DE UNA GUÍA (reglas de PalletFlow + reglas de EUREKA)
   ============================================================ */
function ekValidar(g, codigo, recId){
  const out = [];
  const master = EK.state.master || [];
  if (!String(g.numero_guia || '').trim()) out.push({ nivel:'error', campo:'guia', lote:'—', txt:'Falta el número de guía.' });
  if (master.length && g.lotes.length) {
    const v = validateGuideAgainstMaster(g.lotes, master, g.proveedor);
    v.errors.forEach(e => out.push({ nivel:'error', campo:e.campo, lote:e.lote, guia:e.guia, master:e.master, txt:ekTxtError(e) }));
  }
  for (const [, d] of findDuplicateLotes(g.lotes)) out.push({ nivel:'error', campo:'duplicado', lote:d.lote, guia:d.guia, txt:`El lote ${d.lote} está repetido (${d.guia}).` });
  const conocidas = ekVariedadesConocidas();
  let suma = 0;
  g.lotes.forEach((l, i) => {
    const n = `Lote ${l.lote || (i + 1)}`;
    if (!String(l.lote || '').trim()) out.push({ nivel:'error', campo:'lote', lote:`#${i + 1}`, txt:`La fila ${i + 1} no tiene lote.` });
    if (!(parseInt(l.cantidad, 10) > 0) && !esValleAzulSinJabas(g, l)) out.push({ nivel:'error', campo:'jabas', lote:l.lote || `#${i + 1}`, txt:`${n}: sin cantidad de jabas.` });
    if (!String(l.variedad || '').trim()) out.push({ nivel:'aviso', campo:'variedad', lote:l.lote, txt:`${n}: sin variedad.` });
    else if (!conocidas.includes(ekNorm(l.variedad).trim())) out.push({ nivel:'aviso', campo:'variedad', lote:l.lote, guia:l.variedad, txt:`${n}: la variedad "${l.variedad}" no está en el maestro ni en las reglas.` });
    if (!String(l.clp || '').trim()) out.push({ nivel:'aviso', campo:'clp', lote:l.lote, txt:`${n}: sin CLP.` });
    const kgj = (parseFloat(l.peso) || 0) / (parseInt(l.cantidad, 10) || 1);
    if (l.peso && (kgj < 1.6 || kgj > 3.6)) out.push({ nivel:'aviso', campo:'jabas', lote:l.lote, txt:`${n}: ${l.cantidad} jabas para ${l.peso} kg (${kgj.toFixed(2)} kg/jaba). Revisa si tomó los kilos como jabas.` });
    if (l._jabasDeJarras) out.push({ nivel:'info', campo:'jarras', lote:l.lote, txt:`${n}: ${l.jarras_cantidad} jarras ÷ 12 = ${l.cantidad} jabas (la guía no traía jabas).` });
    suma += parseInt(l.cantidad, 10) || 0;
  });
  if (g.totalJabasGuia && !isValleAzulProv(g.proveedor) && g.totalJabasGuia !== suma) out.push({ nivel:'aviso', campo:'total', lote:'—', txt:`La guía dice ${g.totalJabasGuia} jabas en total y los lotes suman ${suma}.` });
  if (codigo && g.numero_guia) {
    const k = ekCompacto(g.numero_guia);
    const otra = EK.state.receptions.find(r => r.id !== recId && r.codigo === codigo && r.guias.some(x => ekCompacto(x.numero_guia) === k));
    if (otra) out.push({ nivel:'aviso', campo:'repetida', lote:'—', txt:`La guía ${g.numero_guia} ya está registrada (${ekFechaCorta(otra.created)}).`, recId: otra.id });
  }
  return out;
}
function ekTxtError(e){
  const L = { lote:'no existe en el maestro', clp:'CLP distinto al del maestro', clp_proveedor:'CLP de otro proveedor', variedad:'variedad distinta a la del maestro', duplicado:'repetido' };
  if (e.campo === 'lote') return `Lote ${e.lote}: no existe en el maestro.`;
  if (e.campo === 'clp_proveedor') return `Lote ${e.lote}: el CLP ${e.guia || '—'} es de ${e.master || 'otro proveedor'}, no de esta guía.`;
  return `Lote ${e.lote}: ${L[e.campo] || e.campo}. Guía: ${e.guia || '—'} · Maestro: ${e.master || '—'}`;
}
function ekResumenRec(r){
  let err = 0, avi = 0;
  r.guias.forEach(g => ekValidar(g, r.codigo, r.id).forEach(x => { if (x.nivel === 'error') err++; else if (x.nivel === 'aviso') avi++; }));
  return { err, avi };
}

/* ============================================================
   UTILIDADES DE FECHA Y TEXTO
   ============================================================ */
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SETIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
function ekFechaCorta(iso){ if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); if (isNaN(d)) return String(iso); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear()).slice(-2)}`; }
function ekHora(iso){ const d = new Date(iso); return isNaN(d) ? '' : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function ekGrupoTurno(turno){
  const hoy = ekTurnoISO(); const ay = new Date(hoy + 'T12:00:00'); ay.setDate(ay.getDate() - 1);
  const ayer = ekTurnoISO(new Date(ay.getFullYear(), ay.getMonth(), ay.getDate(), 12));
  if (turno === hoy) return 'HOY';
  if (turno === ayer) return 'AYER';
  const d = new Date(turno + 'T12:00:00');
  return `${d.getDate()} DE ${MESES[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`;
}
function ekTotJabas(r){ return r.guias.reduce((s, g) => s + g.lotes.reduce((a, l) => a + (parseInt(l.cantidad, 10) || 0), 0), 0); }
function ekNumLotes(r){ return r.guias.reduce((s, g) => s + g.lotes.length, 0); }
function ekTitulo(r){ return r.title || r.guias.map(g => g.numero_guia || 'Sin número').join(' + '); }
function ekBuscable(r){
  const p = [r.title, r.codigo];
  r.guias.forEach(g => {
    p.push(g.numero_guia, ekCompacto(g.numero_guia), g.conductor, g.placa, g.numeroViaje && ('V' + g.numeroViaje), g.fecha, ekFechaCorta(g.fecha));
    g.lotes.forEach(l => p.push(l.lote, l.variedad, l.clp));
  });
  p.push(ekFechaCorta(r.created), r.turno);
  return ekNorm(p.filter(Boolean).join(' '));
}

// Deslizar a la izquierda = acciones; mantener presionado = seleccionar; tocar = abrir
function ekWireItem(item){
  const row = item.querySelector('.row'), id = item.dataset.id, W = 188;
  let x0 = 0, y0 = 0, dx = 0, drag = false, lp = null, lpFired = false, moved = false;
  const close = () => { item.classList.remove('open'); row.style.transform = ''; };
  row.addEventListener('pointerdown', e => {
    x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; moved = false; lpFired = false;
    if (!EK.ui.sel.size && !item.classList.contains('open')) lp = setTimeout(() => { lpFired = true; navigator.vibrate && navigator.vibrate(25); ekToggleSel(id); }, 480);
  });
  row.addEventListener('pointermove', e => {
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (Math.abs(mx) > 8 || Math.abs(my) > 8) { moved = true; clearTimeout(lp); }
    if (EK.ui.sel.size) return;
    if (!drag && Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my)) { drag = true; row.classList.add('drag'); try { row.setPointerCapture(e.pointerId); } catch (er) {} }
    if (drag) { const base = item.classList.contains('open') ? -W : 0; dx = Math.max(-W - 20, Math.min(0, base + mx)); row.style.transform = `translateX(${dx}px)`; }
  });
  const up = () => { clearTimeout(lp); if (drag) { row.classList.remove('drag'); if (dx < -60) { item.classList.add('open'); row.style.transform = `translateX(${-W}px)`; } else close(); } };
  row.addEventListener('pointerup', up); row.addEventListener('pointercancel', () => { clearTimeout(lp); if (drag) close(); });
  row.addEventListener('contextmenu', e => e.preventDefault());
  row.addEventListener('click', () => {
    if (lpFired) { lpFired = false; return; }
    if (drag || moved) return;
    if (EK.ui.sel.size) { ekToggleSel(id); return; }
    if (item.classList.contains('open')) { close(); return; }
    document.querySelectorAll('.item.open').forEach(o => { o.classList.remove('open'); o.querySelector('.row').style.transform = ''; });
    ekOpenDetail(id);
  });
  item.querySelectorAll('[data-a]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation(); close();
    const r = ekRec(id); if (!r) return;
    if (b.dataset.a === 'fav') { r.favorito = !r.favorito; ekSave(); ekRenderHome(); }
    if (b.dataset.a === 'ren') { const v = await ekPrompt('Renombrar recepción', ekTitulo(r)); if (v != null) { r.title = v.trim() === ekTitulo(Object.assign({}, r, { title:'' })) ? '' : v.trim(); ekSave(); ekRenderHome(); ekToast('Renombrado', 'ok'); } }
    if (b.dataset.a === 'del') ekBorrar([id]);
  });
}

function ekSetHTML(el, html){ EK.ui._busyR = true; try { const a = document.activeElement; if (a && el.contains(a)) a.blur(); el.innerHTML = html; } finally { EK.ui._busyR = false; } }
const ekRec = (id) => EK.state.receptions.find(r => r.id === id);
async function ekBorrar(ids){
  const rs = EK.state.receptions.filter(r => ids.includes(r.id)); if (!rs.length) return;
  const ok = await ekConfirm(rs.length === 1 ? `¿Eliminar la recepción ${ekTitulo(rs[0])}?` : `¿Eliminar ${rs.length} recepciones?`, 'Eliminar', true);
  if (!ok) return;
  const antes = EK.state.receptions.slice();

  ekToast(rs.length === 1 ? 'Recepción eliminada' : `${rs.length} eliminadas`, '', { txt:'Deshacer', fn: () => { EK.state.receptions = antes; ekSave(); ekRenderHome(); } });

/* ============================================================
   LECTURA DE ARCHIVOS (PDF con texto → reglas; foto → a mano)
   ============================================================ */
async function ekImagenComprimida(file, max = 1800){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}
async function ekLeerArchivo(file, codigoTab){
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  let texto = '', preview = '', lineas = null;
  if (isPdf) {
    try { lineas = await pfLineasPdfTodas(file); } catch (e) { lineas = null; }
    texto = lineas ? lineas.map(L => L.t).join('\n') : '';
    try { preview = await rasterizePdfToImage(file); } catch (e) { preview = ''; }
  } else {
    try { preview = await ekImagenComprimida(file); } catch (e) { preview = ''; }
  }
  let g;
  if (texto.trim()) {
    const r = ekLeerTextoGuia(texto, file.name, codigoTab);
    g = Object.assign(ekGuiaVacia(r.codigo || codigoTab), {
      proveedor: r.proveedor !== 'Desconocido' ? r.proveedor : ekGuiaVacia(codigoTab).proveedor,
      numero_guia: r.numero_guia, fecha: r.fecha, conductor: r.conductor, placa: r.placa, carreta: r.carreta,
      numeroViaje: r.numeroViaje, totalJabasGuia: r.totalJabasGuia, totalPalletsGuia: r.totalPalletsGuia,
      lotes: r.lotes.length ? r.lotes : ekGuiaVacia(codigoTab).lotes, _texto: texto, _avisos: r.avisos.slice(), _codigoLeido: r.codigo,
    });
    g.capacity = ekCapDe(r.codigo || codigoTab);
    if (!r.lotes.length) g._avisos.push({ tipo:'aviso', txt:'No encontré lotes con las reglas de este proveedor. Complétalos a mano y revisa "Texto leído" para ajustar las reglas.' });
    try { await pfUbicarLotes(file, true, g.lotes); } catch (e) {}
  } else {
    g = ekGuiaVacia(codigoTab);
    g.numeroViaje = pfViajeDe(file.name || '') || pfViajeFinal(file.name || '');
    g._avisos.push({ tipo:'info', txt: isPdf ? 'Este PDF es una imagen escaneada (no trae texto). Escribe los datos mirando la guía.' : 'Foto: sin IA no se lee automáticamente. Escribe los datos mirando la foto (botón "Ver guía").' });
  }
  g._preview = preview; g._file = file; g._isPdf = isPdf; g._nombre = file.name || '';
  return g;
}
async function ekProcesar(files, source){
  files = Array.from(files || []).filter(Boolean); if (!files.length) return;
  const cfg = tabCfg(EK.ui.tab);
  if (cfg.multi && files.length > 10) { ekToast(`Máximo 10 guías a la vez; se tomaron las primeras 10 de ${files.length}.`); files = files.slice(0, 10); }
  const out = [];
  for (let i = 0; i < files.length; i++) {
    ekBusy(files.length > 1 ? `Leyendo guía ${i + 1} de ${files.length}…` : 'Leyendo la guía…');
    try { out.push(await ekLeerArchivo(files[i], EK.ui.tab)); }
    catch (e) { console.error(e); const g = ekGuiaVacia(EK.ui.tab); g._avisos.push({ tipo:'error', txt:`No se pudo abrir ${files[i].name}: ${e && e.message || 'error'}` }); out.push(g); }

function ekUnificarProveedor(guias, codigo, avisar){
  const p = ekProvPorCodigo(codigo); if (!p) return;
  guias.forEach(g => {

      if (g._texto) { const r2 = ekLeerTextoGuia(g._texto, g._nombre || '', codigo, codigo); if (r2.lotes.length) { const box = g.lotes.map(l => l._box); g.lotes = r2.lotes; g.lotes.forEach((l, i) => { if (box[i]) l._box = box[i]; }); g._avisos = (g._avisos || []).filter(a => !/No encontré lotes/.test(a.txt)); } }

/* ============================================================
   PESO — pallets de la hoja de peso con P. bruto / P. pallet / jabas

  if (!isFFProv(g.proveedor)) { rows.forEach(r => { r.obs = ''; }); const pal = rows.filter(r => !pfFilaVacia(r)); if (pal.length) pal[pal.length - 1].obs = String(pal.length); }
}
function ekOpenPeso(id){ ekOpen('peso', '', {}); EK.ui.pesoRec = id; ekRenderPeso(); }
function ekRenderPeso(){
  const el = $id('peso'); const r = ekRec(EK.ui.pesoRec); if (!el || !r) return;

    const rows = ekFilasPeso(g); const G = pfHojaGrupos(rows);

      const lote = g.lotes[gr.li] || {}; const f0 = gr.filas[0] || {};
      const filas = gr.filas.map((x, k) => ({ x, k: rows.indexOf(x) })).filter(o => !(o.x.groupEnd && pfFilaVacia(o.x) && gr.filas.length > 1));

        ${filas.map((o, n) => {
          const x = o.x; tot++;
          const b = parseFloat(x.pesoBruto) || 0, p = parseFloat(x.pesoPalet) || 0, j = parseInt(x.jabas, 10) || 0, nn = b && p ? b - p : 0;
          if (b) { hechos++; neto += nn; }

          if (nn && j && ((nn / j) < R.kgJabaMin || (nn / j) > R.kgJabaMax)) w.push(`${(nn / j).toFixed(2)} kg por jaba: revisa jabas o pesos.`);
          if (j > ekCapLote(g, lote)) w.push(`Más jabas (${j}) que la capacidad del pallet (${ekCapLote(g, lote)}).`);
          return `<div class="wcard ${w.length ? 'warn' : b ? 'done' : ''}" data-g="${gi}" data-row="${o.k}"><div class="top"><b>Pallet ${n + 1}</b><span class="sp"></span>${b ? (w.length ? '⚠' : '✓') : ''}<button class="ibtn" data-delrow aria-label="Quitar pallet">${ico('trash', 'ico-sm')}</button></div>

              <div><label>Neto</label><div class="neto num">${nn ? nn.toFixed(1) : '—'}</div></div></div>
            ${w.length ? `<div class="warnline">${esc(w.join(' '))}</div>` : ''}</div>`;

  ekSetHTML(el, `<div class="hdr"><button class="back" id="psBack" aria-label="Volver">${ico('left')}</button><div class="ttl"><b>PESO</b><small>${esc(ekTitulo(r))} · ${esc(tabCfg(r.codigo).label)}</small></div><div class="right"></div></div>

    rows.splice(k, 1); ekRegroup(rows, g); g.hojaPesoOverride = rows; ekSave(); ekRenderPeso();

    const g = r.guias[+b.dataset.g], rows = getHojaRows(g), k = +b.dataset.after;
    rows.splice(k + 1, 0, { lote:'', campo:'', codigo:'', clp:'', pesoBruto:'', pesoPalet:'', jabas:'', obs:'' });
    ekRegroup(rows, g); g.hojaPesoOverride = rows; ekSave(); ekRenderPeso();
  });

  $id('psXls').onclick = () => ekExcelPeso(r);

function ekExcelPeso(r){
  if (!window.XLSX) { ekAlert('No se pudo cargar el generador de Excel (revisa la conexión).'); return; }
  const srx = r.codigo === 'SRX';
  const data = [];
  r.guias.forEach(g => {
    const rows = getHojaRows(g); let n = 0;
    pfHojaGrupos(rows).forEach(gr => {
      const l = g.lotes[gr.li] || {}; const f0 = gr.filas[0] || {};
      pfPalletsDeGrupo(gr).forEach(x => {
        n++;
        const b = parseFloat(x.pesoBruto) || 0, p = parseFloat(x.pesoPalet) || 0, j = parseInt(x.jabas, 10) || 0;
        if (srx) data.push({ 'FECHA': ekFechaCorta(g.fecha || r.created), 'Nº GUIA DE REMISION': g.numero_guia, 'PROVEEDOR': g.proveedor, 'VARIEDAD': l.variedad || '', 'PESO SEGUN GR': l.peso || '', 'LOTE': l.lote || f0.campo || '', 'CORRELATIVO': f0.correlativoCode || '', 'Nº PALLET': n, 'PESO BRUTO (KG)': b || '', 'PESO PALLET': p || '', 'PESO NETO': b && p ? +(b - p).toFixed(2) : '', 'CANT. JABAS': j || '', 'CANT. JARRAS': l.jarras ? (parseInt(x.jarras, 10) || j * 12) : '', 'CALIBRE': l.calibre || '', 'CODIGO PRODUCTOR': l.clp || '' });
        else data.push({ '#': data.length + 1, 'Guía': g.numero_guia, 'Fecha': ekFechaCorta(g.fecha || r.created), 'Viaje': g.numeroViaje || '', 'Lote': l.lote || f0.campo || '', 'Variedad': l.variedad || '', 'Correlativo': f0.correlativoCode || '', 'Pallet': n, 'Peso bruto (kg)': b || '', 'Peso parihuela (kg)': p || '', 'Peso neto (kg)': b && p ? +(b - p).toFixed(2) : '', 'Jabas': j || '', 'CLP': l.clp || '' });
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Pesaje');
  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });

    const f = EK.ui.mFiltro || 'FF', p = ekProvPorCodigo(f);
    const rows = (EK.state.master || []).map((m, i) => ({ m, i })).filter(o => ekCodigoProveedor(o.m.proveedor) === f);
    body = `<div class="pills" style="margin-bottom:12px">${EK_TABS.map(x => `<button class="pill ${x.codigo === f ? 'on' : ''}" data-mf="${x.codigo}">${x.codigo}</button>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn sm" id="mAdd">${ico('plus', 'ico-sm')}Agregar</button><button class="btn sm" id="mXls">${ico('upload', 'ico-sm')}Cargar Excel</button><button class="btn sm" id="mReset">Restaurar</button></div>
      <div style="font-size:12px;color:var(--mut);margin-bottom:6px">${rows.length} registros de ${esc(p ? p.nombre : f)} · el maestro valida lote, variedad y CLP de cada guía.</div>
      ${rows.map(o => `<div class="mrow"><b>${esc(o.m.lote)}</b><div>${esc(o.m.variedad)}<small>${esc(o.m.senasa)} · ${esc(o.m.codigo)}${o.m.cod_variedad ? ' · ' + esc(o.m.cod_variedad) : ''}</small></div><button class="ibtn" data-me="${o.i}" aria-label="Editar">${ico('pencil', 'ico-sm')}</button></div>`).join('') || '<div class="empty">Sin registros</div>'}`;
  } else if (t === 'reglas') {
    const lin = (o) => Object.entries(o || {}).map(([k, v]) => `${k} = ${v}`).join('\n');
    body = `<div class="sec"><h4>Variedades: cómo viene escrito = nombre real</h4><textarea class="inp" id="rgVar" placeholder="SUNRAISE = EUREKA SUNRISE&#10;SEKOYA = SEKOYA POP">${esc(lin(R.variedadAlias))}</textarea>
        <div style="font-size:12px;color:var(--mut);margin-top:6px">Además de esto, EUREKA ya corrige errores de 1–2 letras comparando con el maestro.</div></div>
      <div class="sec"><h4>Proveedores: cómo viene escrito = código</h4><textarea class="inp" id="rgProv" placeholder="FAMILI FARM = FF&#10;SUR EXPORTS = SRX">${esc(lin(R.proveedorAlias))}</textarea></div>
      <div class="sec"><h4>Jabas por pallet</h4><div class="grid2">${EK_TABS.map(x => `<div class="fld"><label>${x.codigo}</label><input class="inp num" data-capr="${x.codigo}" type="number" inputmode="numeric" value="${esc(R.capacidades[x.codigo] || '')}" placeholder="${x.codigo === 'VA' || x.codigo === 'AF' ? 'según guía' : ''}"></div>`).join('')}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:6px">Jarras y jabas verdes de Diamond: 50 por pallet.</div></div>
      <div class="sec"><h4>Control de pesos</h4><div class="grid2">
        <div class="fld"><label>P. bruto mínimo</label><input class="inp num" id="rgMin" type="number" value="${R.pesoMin}"></div><div class="fld"><label>P. bruto máximo</label><input class="inp num" id="rgMax" type="number" value="${R.pesoMax}"></div>
        <div class="fld"><label>Kg/jaba mínimo</label><input class="inp num" id="rgKmin" type="number" step="0.1" value="${R.kgJabaMin}"></div><div class="fld"><label>Kg/jaba máximo</label><input class="inp num" id="rgKmax" type="number" step="0.1" value="${R.kgJabaMax}"></div></div></div>
      <button class="btn pri full" id="rgSave">Guardar reglas</button>`;
  } else if (t === 'turno') {
    const filas = pfCorrOrdenados(pfCorrLeer());
    body = `<div class="sec"><h4>Último correlativo por proveedor</h4>${['FF', 'DB', 'CN', 'SE', 'AF'].map(k => `<div class="mrow"><b>${k}</b><div>${(correlativoAutoState[k] || {}).lastUsed || 0}<small>la próxima guía sugiere ${((correlativoAutoState[k] || {}).lastUsed || 0) + 1}</small></div><button class="ibtn" data-cu="${k}" aria-label="Cambiar">${ico('pencil', 'ico-sm')}</button></div>`).join('')}</div>
      <div class="sec"><h4>Correlativos impresos · turno ${esc(getShiftDate())}</h4>
      ${filas.length ? `<div class="tblwrap"><table class="corr"><thead><tr><th>N°</th><th>Correlativo</th><th>Proveedor</th><th>Lote</th><th>Variedad</th><th>Viaje</th></tr></thead><tbody>${filas.map((f, i) => { const h = pfCorrHuecoTras(filas, i); return `<tr><td>${i + 1}</td><td class="c">${esc(pfCorrGuion(f.cod))}</td><td>${esc(f.prov)}</td><td>${esc(f.lote)}</td><td>${esc(f.variedad || '')}</td><td>${esc(f.viaje || '')}</td></tr>${h ? `<tr class="hueco"><td colspan="6">⚠ ${esc(pfCorrHuecoTxt(h))}</td></tr>` : ''}`; }).join('')}</tbody></table></div><div style="font-size:12px;color:var(--mut);margin-top:8px">${filas.length} correlativos</div>` : '<div class="empty">Aún no se imprimen rótulos en este turno.</div>'}</div>`;
  } else {
    body = `<div class="sec"><h4>Respaldo</h4><div class="msgs" style="margin-bottom:10px"><div class="msg info">Los datos viven en este dispositivo. Descarga un respaldo cada cierto tiempo y cárgalo en el otro celular para pasar la información.</div></div>
      <button class="btn white full" id="bkDown">${ico('download', 'ico-sm')}Descargar respaldo</button><button class="btn full" id="bkUp" style="margin-top:8px">${ico('upload', 'ico-sm')}Cargar respaldo</button></div>
      <div class="sec"><h4>Datos</h4><div style="font-size:13px;color:var(--mut);margin-bottom:10px">${EK.state.receptions.length} recepciones · ${(EK.state.master || []).length} registros en el maestro</div>
      <button class="btn danger full" id="bkWipe">Borrar todas las recepciones</button></div>
      <div style="font-size:12px;color:var(--mut2);text-align:center">EUREKA 1.0 · sin IA · motor de PalletFlow 43</div>`;
  }
  el.innerHTML = `<div class="hdr"><button class="back" id="stBack" aria-label="Cerrar">${ico('x')}</button><div class="ttl"><b>Ajustes</b><small>Maestro, reglas y respaldo</small></div><div class="right"></div></div>
    <div class="stabs">${[['maestro', 'Maestro'], ['reglas', 'Reglas'], ['turno', 'Correlativos'], ['respaldo', 'Respaldo']].map(([k, n]) => `<button class="pill ${k === t ? 'on' : ''}" data-st="${k}">${n}</button>`).join('')}</div>
    <div class="body">${body}</div>`;
  $id('stBack').onclick = () => { ekClose('settings'); ekRender(); };
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { EK.ui.settingsTab = b.dataset.st; ekRenderSettings(); });
  el.querySelectorAll('[data-mf]').forEach(b => b.onclick = () => { EK.ui.mFiltro = b.dataset.mf; ekRenderSettings(); });
  if ($id('mAdd')) $id('mAdd').onclick = () => ekMasterForm(-1);
  el.querySelectorAll('[data-me]').forEach(b => b.onclick = () => ekMasterForm(+b.dataset.me));
  if ($id('mXls')) $id('mXls').onclick = () => $id('inXls').click();
  if ($id('mReset')) $id('mReset').onclick = async () => { if (await ekConfirm('¿Volver al maestro original de PalletFlow? Se pierden los cambios hechos aquí.', 'Restaurar', true)) { EK.state.master = clone(MASTER_DEFAULT); ekSave(); ekRenderSettings(); } };
  if ($id('rgSave')) $id('rgSave').onclick = () => {
    const parse = (t2) => { const o = {}; t2.split('\n').forEach(line => { const k = line.split('='); if (k.length >= 2 && k[0].trim() && k.slice(1).join('=').trim()) o[ekNorm(k[0]).trim()] = ekNorm(k.slice(1).join('=')).trim(); }); return o; };
    R.variedadAlias = parse($id('rgVar').value); R.proveedorAlias = parse($id('rgProv').value);
    el.querySelectorAll('[data-capr]').forEach(i => { R.capacidades[i.dataset.capr] = parseInt(i.value, 10) || 0; });
    R.pesoMin = +$id('rgMin').value || 100; R.pesoMax = +$id('rgMax').value || 1500; R.kgJabaMin = +$id('rgKmin').value || 1.8; R.kgJabaMax = +$id('rgKmax').value || 3.4;
    ekSave(); ekToast('Reglas guardadas', 'ok');
  };
  el.querySelectorAll('[data-cu]').forEach(b => b.onclick = async () => { const k = b.dataset.cu; const v = await ekPrompt(`Último correlativo usado (${k})`, (correlativoAutoState[k] || {}).lastUsed || 0, 'number'); if (v == null) return; const st = correlativoAutoState[k] || (correlativoAutoState[k] = { lastUsed:0, seenGuides:{} }); st.lastUsed = parseInt(v, 10) || 0; saveCorrelativoAutoState(); ekRenderSettings(); });
  if ($id('bkDown')) $id('bkDown').onclick = () => { const s = JSON.stringify({ app:'EUREKA', version:1, fecha:new Date().toISOString(), state:EK.state }); ekDescargar(new Blob([s], { type:'application/json' }), `eureka-respaldo-${ekTurnoISO()}.json`); };
  if ($id('bkUp')) $id('bkUp').onclick = () => $id('inJson').click();
  if ($id('bkWipe')) $id('bkWipe').onclick = async () => { if (await ekConfirm('¿Borrar TODAS las recepciones de este dispositivo? No se puede deshacer.', 'Borrar todo', true)) { EK.state.receptions = []; ekSave(); ekRender(); ekRenderSettings(); } };
}
function ekMasterForm(i){
  const m = i >= 0 ? EK.state.master[i] : { proveedor:(ekProvPorCodigo(EK.ui.mFiltro || 'FF') || {}).nombre || '', lote:'', variedad:'', cod_variedad:'', codigo:'', senasa:'' };
  const d = ekSheet(`<div class="sh"><div><h3>${i >= 0 ? 'Editar registro' : 'Nuevo registro'}</h3><p>${esc(m.proveedor)}</p></div><button class="ibtn" id="mfX" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="grid2">${[['lote', 'Lote (ej. LOTE 1, M1 S1)'], ['variedad', 'Variedad'], ['cod_variedad', 'Cód. variedad'], ['codigo', 'Código'], ['senasa', 'SENASA / CLP']].map(([k, n]) => `<div class="fld" ${k === 'variedad' || k === 'lote' ? 'style="grid-column:1/-1"' : ''}><label>${n}</label><input class="inp" data-mk="${k}" value="${esc(m[k] || '')}" autocapitalize="characters"></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:14px">${i >= 0 ? '<button class="btn danger" id="mfDel">Eliminar</button>' : ''}<button class="btn pri" style="flex:1" id="mfOk">Guardar</button></div>`);
  d.querySelector('#mfX').onclick = () => ekCloseSheet();
  d.querySelector('#mfOk').onclick = () => {
    const n = Object.assign({}, m); d.querySelectorAll('[data-mk]').forEach(x => { n[x.dataset.mk] = ekNorm(x.value).trim(); });
    if (!n.lote) { ekAlert('Escribe el lote.'); return; }
    if (n.senasa && !/^\d{3}-\d{5}-\d{2}$/.test(n.senasa) && !/^\d{1,3}$/.test(n.senasa)) ekToast('Revisa el SENASA: el formato usual es 016-41724-01');
    const dup = EK.state.master.findIndex((x, k) => k !== i && providerMatch(x.proveedor, n.proveedor) && normalizeLoteId(x.lote) === normalizeLoteId(n.lote) && normalizeVariedad(x.variedad) === normalizeVariedad(n.variedad));
    if (dup >= 0) { ekAlert('Ya existe ese lote con esa variedad en el maestro.'); return; }
    if (i >= 0) EK.state.master[i] = n; else EK.state.master.push(n);
    ekSave(); ekCloseSheet(); ekRenderSettings();
  };
  if (d.querySelector('#mfDel')) d.querySelector('#mfDel').onclick = async () => { if (await ekConfirm('¿Eliminar este registro del maestro?', 'Eliminar', true)) { EK.state.master.splice(i, 1); ekSave(); ekCloseSheet(); ekRenderSettings(); } };
}
function ekCargarMaestroExcel(file){
  if (!window.XLSX) { ekAlert('No se pudo cargar el lector de Excel (revisa la conexión).'); return; }
  const fr = new FileReader();
  fr.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      const nk = (k) => ekCompacto(k);
      const pick = (r, ops) => { const k = Object.keys(r).find(x => ops.includes(nk(x))); return k ? String(r[k]).trim() : ''; };
      const out = rows.map(r => {
        const provTxt = pick(r, ['PROVEEDOR', 'SUPPLIER', 'SUPPLIERCODE', 'CODPROVEEDOR', 'PROV']);
        const c = ekCodigoProveedor(provTxt); const p = ekProvPorCodigo(c);
        return { proveedor: p ? p.nombre : ekNorm(provTxt).trim(), lote: ekNorm(pick(r, ['LOTE', 'LOT'])).trim(), variedad: ekNorm(pick(r, ['VARIEDAD', 'VARIETY'])).trim(), cod_variedad: ekNorm(pick(r, ['CODVARIEDAD', 'CODVAR'])).trim(), codigo: ekNorm(pick(r, ['CODIGO', 'COD', 'CODE'])).trim(), senasa: pick(r, ['SENASA', 'CLP']) };
      }).filter(r => r.lote || r.variedad);
      if (!out.length) { ekAlert('No encontré filas con columnas LOTE / VARIEDAD en el Excel.'); return; }
      const reemplazar = await ekDialog({ titulo:'Cargar maestro', texto:`${out.length} registros leídos. ¿Reemplazar todo el maestro o solo agregar los nuevos?`, ok:'Reemplazar', cancel:'Agregar' });
      if (reemplazar) EK.state.master = out;
      else out.forEach(n => { if (!EK.state.master.some(x => providerMatch(x.proveedor, n.proveedor) && normalizeLoteId(x.lote) === normalizeLoteId(n.lote) && normalizeVariedad(x.variedad) === normalizeVariedad(n.variedad))) EK.state.master.push(n); });
      ekSave(); ekRenderSettings(); ekToast('Maestro actualizado', 'ok');
    } catch (err) { ekAlert('No se pudo leer el Excel: ' + (err && err.message || 'error')); }
  };
  fr.readAsArrayBuffer(file);
}
function ekCargarRespaldo(file){
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const j = JSON.parse(fr.result); const s = j.state || j;
      if (!Array.isArray(s.receptions)) throw new Error('El archivo no es un respaldo de EUREKA.');
      const ok = await ekDialog({ titulo:'Cargar respaldo', texto:`${s.receptions.length} recepciones. ¿Reemplazar lo de este dispositivo o juntar ambos?`, ok:'Juntar', cancel:'Reemplazar' });
      if (ok) { const ids = new Set(EK.state.receptions.map(r => r.id)); s.receptions.forEach(r => { if (!ids.has(r.id)) EK.state.receptions.push(r); }); }
      else { EK.state.receptions = s.receptions; if (s.master) EK.state.master = s.master; if (s.reglas) EK.state.reglas = s.reglas; if (s.correlativoAutoState) { EK.state.correlativoAutoState = s.correlativoAutoState; correlativoAutoState = s.correlativoAutoState; } }
      ekSave(); ekRender(); ekRenderSettings(); ekToast('Respaldo cargado', 'ok');
    } catch (e) { ekAlert('No se pudo cargar: ' + e.message); }
  };
  fr.readAsText(file);
}

/* ============================================================
   ARRANQUE
   ============================================================ */
(async function init(){
  await ekLoad();
  ekRenderHome(); ekRenderFab();
  $id('fabScrim').onclick = () => { $id('fab').classList.remove('open'); $id('fabScrim').classList.add('hide'); ekRenderFab(); };
  const wire = (id, fn) => $id(id).addEventListener('change', e => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (fs.length) fn(fs); });
  wire('inPdf', fs => ekProcesar(fs, 'pdf'));
  wire('inImg', fs => ekProcesar(fs, 'image'));
  wire('inCam', fs => tabCfg(EK.ui.tab).multi ? ekDbSheet(fs, 'image') : ekProcesar(fs, 'camera'));
  wire('inPdfMulti', fs => ekDbSheet(fs, 'pdf'));
  wire('inImgMulti', fs => ekDbSheet(fs, 'image'));
  wire('inXls', fs => ekCargarMaestroExcel(fs[0]));
  wire('inJson', fs => ekCargarRespaldo(fs[0]));
  window.addEventListener('resize', ekPosTab);
  if (window.PDFJS) { try { PDFJS.disableWorker = true; } catch (e) {} }
})();

</script>
