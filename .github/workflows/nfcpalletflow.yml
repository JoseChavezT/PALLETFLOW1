name: NFCPalletflow APK

on:
  push:
    branches: [claude/apk-modification-abx03c, main]
    paths:
      - "nfcpalletflow/**"
      - ".github/workflows/nfcpalletflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfcpalletflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NFCPalletflow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NFCPalletflow
          path: nfcpalletflow/NFCPalletflow.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nfcpalletflow-latest
          name: NFCPalletflow (última versión)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "APK compilada desde ${{ github.sha }}. Descarga NFCPalletflow.apk e instálala en el teléfono."
          files: nfcpalletflow/NFCPalletflow.apk
