<meta name="apple-mobile-web-app-title" content="Cuadre">
<style>
:root{
  /* Valores iniciales; el JS los reemplaza con los de Personalizar */
  --bg:#07070D; --bgfill:#07070D; --fg:#fff; --s1:rgba(255,255,255,.06); --s2:rgba(255,255,255,.11); --s3:rgba(255,255,255,.18);
  --mut:rgba(255,255,255,.62); --faint:rgba(255,255,255,.36);
  --acc:#fff; --acc2:#D5D9E0; --grad:linear-gradient(135deg,#fff,#D5D9E0); --accfg:#0a0a0a; --accglow:rgba(255,255,255,.3);
  --minus:#F6465D; --num:#fff; --loosec:#fff; --glowc:#fff; --capc:#fff; --chipc:#34D399;
  --r:0px; --edge:inset 0 0 0 0 transparent; --dens:1; --tm:1; --ui:1; --numscale:1; --inscale:1; --track:-.03em; --phs:1;
  --font:'Albert Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --numfont:'Albert Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --numstyle:normal; --numweight:800;
  --glow:.35; --gt:5; --gy:40%; --gshape:circle 330px; --gmid:42%;
  --aurI:.7; --aurS:1; --aurT:20s; --aurA:#1F8A8F; --aurB:#6B2FB3; --aurC:#1B2B5E;
  --cardbg:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)); --cardblur:12px;
  --cardedge:inset 0 0 0 1px rgba(255,255,255,.22); --inedge:inset 0 0 0 1.5px rgba(255,255,255,.6); --capsedge:inset 0 0 0 1px rgba(255,255,255,.32); --capsbg:rgba(255,255,255,.05);
  --caph:46; --inh:72; --addw:64; --sheetbg:rgba(16,16,26,.55);
  --texa:.03; --tex:none; --texsize:auto; --vh:100dvh;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{height:100%;margin:0;color:var(--fg);font-family:var(--font);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{background:var(--bgfill)}
input,textarea{-webkit-user-select:text;user-select:text}
::selection{background:rgba(255,255,255,.22);color:inherit}
button,input,select,textarea{font:inherit;color:inherit;border-radius:var(--r)}
button{border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{border:0;outline:0}
.hidden{display:none!important}
body::before{content:"";position:fixed;inset:0;pointer-events:none;color:var(--fg);background-image:var(--tex);background-size:var(--texsize);opacity:var(--texa);z-index:1}

/* ====================== FONDO: AURORA + HALO (toda la pantalla) ====================== */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aurI)}
.ab{position:absolute;border-radius:50%;will-change:transform}
.ab.a{width:calc(95vw*var(--aurS));height:calc(95vw*var(--aurS));left:-30vw;top:-10vh;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--aurA) 90%,transparent),transparent);animation:driftA var(--aurT) ease-in-out infinite alternate}
.ab.b{width:calc(100vw*var(--aurS));height:calc(100vw*var(--aurS));right:-34vw;top:-14vh;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--aurB) 90%,transparent),transparent);animation:driftB calc(var(--aurT)*1.25) ease-in-out infinite alternate}
.ab.c{width:calc(120vw*var(--aurS));height:calc(80vw*var(--aurS));left:-10vw;bottom:-18vh;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--aurC) 85%,transparent),transparent);animation:driftC calc(var(--aurT)*1.5) ease-in-out infinite alternate}
.noaurora .aurora{display:none}
.fxc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--aurI)}
.nofxc .fxc{display:none}
.halo,.halokick{position:fixed;inset:0;pointer-events:none;z-index:0;transform-origin:50% var(--gy)}
.halo{background:radial-gradient(var(--gshape) at 50% var(--gy),color-mix(in srgb,var(--glowc) 80%,transparent) 0,color-mix(in srgb,var(--glowc) 30%,transparent) var(--gmid),transparent 100%);
  opacity:calc(var(--glow)*.5);animation:breathe calc(var(--gt)*1s*var(--tm)) ease-in-out infinite}
.halokick{background:radial-gradient(var(--gshape) at 50% var(--gy),color-mix(in srgb,var(--glowc) 65%,#fff) 0,color-mix(in srgb,var(--glowc) 25%,transparent) 45%,transparent 100%);opacity:0}
.halokick.go{animation:kick calc(.6s*var(--tm)) ease-out}
.halokick.go.strong{animation:kickS calc(.85s*var(--tm)) ease-out}
.nobreathe .halo{animation:none}

/* ====================== APP (solo teléfono) ====================== */
.app{position:relative;z-index:2;width:100%;height:100vh;height:var(--vh);display:flex;flex-direction:column;
  gap:calc(10px*var(--dens));padding:calc(env(safe-area-inset-top,0px) + 12px) 0 0;overflow:hidden}
.app>*{animation:rise calc(.55s*var(--tm)) var(--ease) both}
.app>:nth-child(2){animation-delay:calc(.06s*var(--tm))}
.app>:nth-child(3){animation-delay:calc(.12s*var(--tm))}
.app>:nth-child(4){animation-delay:calc(.2s*var(--tm))}

.rip{position:relative;overflow:hidden}
.rp{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:currentColor;opacity:.3;pointer-events:none;
  transform:scale(0);animation:ripple calc(.6s*var(--tm)) ease-out forwards}
.noripple .rp{display:none}

/* ---- Encabezado ---- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:0 16px}
.hl{min-width:0}
.date{font-size:calc(11px*var(--ui));font-weight:600;color:var(--mut);letter-spacing:.02em;margin-bottom:2px;white-space:nowrap}
.nodate .date{display:none}
.title{font-weight:800;font-size:calc(23px*var(--ui));letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tupper .title{text-transform:uppercase;letter-spacing:.03em;font-size:calc(19px*var(--ui))}
.notitle .title{visibility:hidden}
.nocopytop #copy{display:none}
.acts{display:flex;gap:6px;flex:none}
.hb{height:calc(40px*var(--dens));padding:0 14px;background:var(--s1);box-shadow:var(--edge);border-radius:var(--r);color:var(--mut);
  font-weight:600;font-size:calc(13px*var(--ui));display:inline-grid;place-items:center;transition:background calc(.15s*var(--tm)),transform calc(.12s*var(--tm)) var(--spring)}
.hb:active{background:var(--s3);transform:scale(.94)}
.hb.ico{width:calc(40px*var(--dens));padding:0}
.hb svg{width:20px;height:20px}
.chiprow{margin:0 16px;display:flex}
.nochip .chiprow{display:none}
.statchip{display:inline-flex;align-items:center;gap:9px;height:calc(34px*var(--dens));padding:0 14px 0 12px;
  background:color-mix(in srgb,var(--chipc) 13%,transparent);color:var(--chipc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--chipc) 20%,transparent);border-radius:var(--r);
  font-size:calc(13px*var(--ui));font-weight:700;transition:opacity calc(.25s*var(--tm)),transform calc(.12s*var(--tm)) var(--spring)}
.statchip:active{transform:scale(.96)}
.statchip.off{opacity:.6}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--chipc);box-shadow:0 0 9px var(--chipc);flex:none}

/* ====================== TARJETA DE CRISTAL ====================== */
.card{margin:0 12px;flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--cardbg);box-shadow:var(--cardedge);border-radius:var(--r);overflow:hidden;
  -webkit-backdrop-filter:blur(var(--cardblur));backdrop-filter:blur(var(--cardblur))}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 16px 0}
html[data-pos="top"] .stage{justify-content:flex-start;padding-top:calc(26px*var(--dens))}
html[data-pos="bottom"] .stage{justify-content:flex-end;padding-bottom:calc(20px*var(--dens))}
.kicker{font-size:calc(11px*var(--ui));letter-spacing:.34em;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:calc(20px*var(--dens));padding-left:.34em}
.nokicker .kicker{display:none}
.big{display:flex;align-items:flex-end;justify-content:center;gap:16px;flex-wrap:wrap;min-height:calc(88px*var(--numscale))}
.blk{display:flex;flex-direction:column;align-items:center;line-height:1}
.num{font-family:var(--numfont);font-style:var(--numstyle);font-weight:var(--numweight);letter-spacing:var(--track);
  font-size:calc(clamp(52px,19vw,92px)*var(--numscale));color:var(--num);font-variant-numeric:tabular-nums}
html[data-na="pop"] .num,html[data-na="pop"] .op{animation:popIn calc(.3s*var(--tm)) var(--spring)}
html[data-na="roll"] .num,html[data-na="roll"] .op{animation:rollIn calc(.38s*var(--tm)) var(--ease)}
.blk.loose .num{color:var(--loosec)}
.blk.minus .num{color:var(--minus)}
.blk.dim .num{color:var(--faint)}
.lbl{font-style:normal;font-size:calc(12px*var(--ui));letter-spacing:.22em;font-weight:700;color:color-mix(in srgb,var(--fg) 82%,transparent);margin-top:calc(14px*var(--dens));text-transform:uppercase;padding-left:.22em}
.nolbl .lbl{display:none}
.op{font-family:var(--numfont);font-weight:800;font-size:calc(40px*var(--numscale));margin-bottom:calc(30px*var(--numscale))}
.nolbl .op{margin-bottom:calc(8px*var(--numscale))}
.op.loose{color:var(--loosec)} .op.minus{color:var(--minus)}
.phrase{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:calc(18px*var(--dens));min-height:calc(22px*var(--ui));
  font-size:calc(15px*var(--ui)*var(--phs));font-weight:600;color:var(--mut)}
.phrase b{color:var(--fg);font-weight:800}
.phrase svg{width:1.1em;height:1.1em;flex:none}
.nophrase .phrase{display:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.meta:empty,.nochips .meta{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:calc(26px*var(--ui)*var(--phs));padding:0 10px;background:var(--s2);box-shadow:var(--edge);border-radius:var(--r);
  font-size:calc(12.5px*var(--ui)*var(--phs));color:var(--mut);font-variant-numeric:tabular-nums}
.chip b{color:var(--fg);font-weight:700}
.dot{width:7px;height:7px;display:inline-block}

/* ---- Controles dentro de la tarjeta ---- */
.ctrls{flex:none;display:flex;flex-direction:column;gap:calc(14px*var(--dens));padding:14px 14px calc(14px*var(--dens))}
.inrow{display:flex;gap:8px;align-items:stretch}
.addleft .inrow{flex-direction:row-reverse}
.inbox{flex:1;position:relative;display:flex;align-items:center;background:var(--s2);box-shadow:var(--inedge);border-radius:var(--r);overflow:hidden;
  transition:background calc(.2s*var(--tm)),box-shadow calc(.3s*var(--tm))}
.inbox:focus-within{background:var(--s3);box-shadow:var(--inedge),0 0 24px -4px color-mix(in srgb,var(--glowc) 60%,transparent)}
.inico{position:absolute;left:16px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--faint);pointer-events:none}
.inico svg{width:20px;height:20px;display:block}
.noinicon .inico{display:none}
#inMain{width:100%;height:calc(var(--inh)*1px*var(--dens));background:transparent;text-align:center;font-family:var(--numfont);font-weight:800;font-size:calc(38px*var(--inscale));
  padding:0 52px 0 46px;color:var(--fg);caret-color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#inMain::placeholder,.fake{color:var(--faint);font-weight:600;font-size:calc(17px*var(--ui));letter-spacing:0}
.fake{width:100%;height:calc(var(--inh)*1px*var(--dens));display:grid;place-items:center;text-align:center;padding:0 54px;font-family:var(--numfont);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clr{position:absolute;right:8px;top:50%;margin-top:-20px;width:40px;height:40px;display:grid;place-items:center;background:var(--s3);color:var(--mut);border-radius:var(--r)}
.clr:active{background:var(--s2)}
.revrow{flex:1;display:flex;align-items:flex-end;gap:6px}
.rf{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.rf label{font-size:calc(10px*var(--ui));letter-spacing:.16em;color:var(--mut);text-transform:uppercase;text-align:center;font-weight:700}
.rf input{width:100%;height:calc(var(--inh)*1px*var(--dens)*.9);background:var(--s2);box-shadow:var(--inedge);border-radius:var(--r);text-align:center;font-family:var(--numfont);font-weight:800;
  font-size:calc(30px*var(--inscale));padding:0 4px;color:var(--fg);caret-color:var(--fg);font-variant-numeric:tabular-nums}
.rf input:focus{background:var(--s3)}
.rplus{font-size:26px;color:var(--faint);padding-bottom:16px}
.add{width:calc(var(--addw)*1px);flex:none;display:grid;place-items:center;background:var(--grad);color:var(--accfg);border-radius:var(--r);
  font-size:calc(38px*var(--ui));font-weight:700;line-height:1;box-shadow:0 0 20px var(--accglow);transition:transform calc(.12s*var(--tm)) var(--spring)}
.add:active{transform:scale(.9)}
.add.pulse{animation:pop calc(.36s*var(--tm)) var(--spring)}
.add.shake{animation:shake calc(.28s*var(--tm))}

.capsbox{align-self:center;max-width:100%;padding:4px;background:var(--capsbg);box-shadow:var(--capsedge);border-radius:var(--r)}
.caps{display:flex;gap:4px;align-items:stretch}
.cap{flex:none;min-width:calc(62px*var(--ui));padding:0 10px;height:calc(var(--caph)*1px*var(--dens));display:grid;place-items:center;background:transparent;border-radius:var(--r);
  color:var(--mut);font-weight:800;font-size:calc(18px*var(--ui));font-variant-numeric:tabular-nums;transition:background calc(.2s*var(--tm)),transform calc(.15s*var(--tm)) var(--spring)}
.cap:active{transform:scale(.93)}
.cap.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--on);box-shadow:0 0 16px var(--cg),0 0 26px var(--cg2);animation:pop calc(.36s*var(--tm)) var(--spring)}
.cap.other{position:relative;padding:0;width:calc(66px*var(--ui))}
.cap.other input{width:100%;height:100%;background:transparent;text-align:center;color:inherit;font-weight:700;font-size:inherit;padding:0 6px;min-width:0}
.cap.other input::placeholder,.cap.other span{color:var(--faint);font-weight:700;font-size:calc(14px*var(--ui))}
.cap.other.on input::placeholder{color:var(--on)}
.revbtn{align-self:center;height:calc(40px*var(--dens));padding:0 16px;display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-weight:700;font-size:calc(14px*var(--ui));
  border-radius:var(--r);transition:background calc(.2s*var(--tm)),color calc(.2s*var(--tm)),transform calc(.12s*var(--tm)) var(--spring)}
.revbtn svg{width:16px;height:16px;flex:none}
.revbtn:active{transform:scale(.94)}
.revbtn.on{background:var(--s3);color:var(--fg)}

/* ====================== HOJA DEL HISTORIAL ====================== */

.dz.drag .grab i{width:64px;background:var(--fg)}
.nograb .grab{display:none}
.hbar{display:flex;align-items:center;gap:8px;min-height:calc(34px*var(--dens));padding-bottom:6px}
.sheet[data-hs="closed"] .hbar{display:none}
.hlabel{display:inline-flex;align-items:center;gap:8px;font-size:calc(13px*var(--ui));font-weight:700;color:color-mix(in srgb,var(--fg) 84%,transparent)}
.spc{flex:1}
.hhint{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--ui));color:var(--mut)}

  color:var(--mut);font-size:calc(12.5px*var(--ui));font-weight:700;transition:transform calc(.12s*var(--tm)) var(--spring)}
.hbtn:active{transform:scale(.94)}
.hbadge{min-width:18px;height:18px;padding:0 5px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center;border-radius:var(--r)}
.hbadge.bump{animation:pop calc(.4s*var(--tm)) var(--spring)}
.histwrap{height:0;overflow:hidden;transition:height calc(.42s*var(--tm)) var(--ease)}
.hist{height:100%;display:flex;flex-direction:column;gap:calc(6px*var(--dens));overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
.hist::-webkit-scrollbar{display:none}
.sheet:not([data-hs="open"]) .hist{overflow:hidden}
.hempty{text-align:center;color:var(--faint);font-size:calc(13px*var(--ui));padding:12px 0}
.row{position:relative;display:grid;grid-template-columns:1fr auto 30px;align-items:center;gap:8px;min-height:calc(54px*var(--dens));
  padding:calc(6px*var(--dens)) 2px calc(6px*var(--dens)) 16px;background:var(--s1);box-shadow:var(--edge);border-radius:var(--r);cursor:pointer;flex:none;
  transition:background calc(.15s*var(--tm)),transform calc(.12s*var(--tm)) var(--spring)}
.row:active{transform:scale(.985)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
html[data-row="slide"] .row.new{animation:slideL calc(.38s*var(--tm)) var(--ease)}
html[data-row="fade"] .row.new{animation:fadeIn calc(.35s*var(--tm)) ease-out}
html[data-row="pop"] .row.new{animation:popIn calc(.4s*var(--tm)) var(--spring)}
.q{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap;font-family:var(--numfont);font-weight:700;font-size:calc(24px*var(--ui));letter-spacing:-.01em;font-variant-numeric:tabular-nums}

.notime .tm{display:none}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.r b{font-family:var(--numfont);font-style:var(--numstyle);font-weight:var(--numweight);font-size:calc(24px*var(--ui));letter-spacing:var(--track)}
.r u{text-decoration:none;font-size:calc(12px*var(--ui));color:var(--mut);font-weight:600;margin:0 2px 0 3px}

.r .ls{color:var(--loosec)} .r .ms{color:var(--minus)}

/* compacto: teclado abierto */
.compact .date,.compact .keys,.compact .kicker,.compact .hhint{display:none}
.tiny .meta{display:none}

/* ---- Aviso ---- */

/* ====================== PERSONALIZAR ====================== */
.cust{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;color:#fff;
  --bg:#000;--bgfill:#000;--fg:#fff;--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.1);--s3:rgba(255,255,255,.17);--mut:rgba(255,255,255,.6);--faint:rgba(255,255,255,.34);
  --acc:#fff;--acc2:#fff;--grad:linear-gradient(135deg,#fff,#fff);--accfg:#000;--accglow:rgba(255,255,255,.2);--r:0px;--edge:inset 0 0 0 0 transparent;
  --ui:1;--dens:1;--tm:1;--font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-family:var(--font);
  height:100vh;height:var(--vh);transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}

.cust-body.swap{animation:tabIn .3s var(--ease)}

.help{margin:0 0 10px;font-size:13px;line-height:1.45;color:var(--mut)}
.help b{color:#fff}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--s1);padding:12px;margin-bottom:6px}
.ctl .cl{flex:1;min-width:0;font-size:14px;font-weight:600}
.ctl output{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.ctl.col{display:block}
.ctl.col .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--s3)}

input[type=range]::-moz-range-thumb{width:20px;height:20px;background:#fff;border:0;border-radius:0}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:34px;padding:0;background:none;border:0;border-radius:0;cursor:pointer}

.hex,.txt,.nf{background:var(--s2);height:36px;padding:0 10px;color:#fff;font-size:14px;border-radius:0;min-width:0}

/* ====================== TECLADO PROPIO (copia del teclado numérico de Gboard) ====================== */
.kbwrap{flex:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transition:padding-bottom calc(.34s*var(--tm)) var(--ease),background calc(.3s*var(--tm))}

.kbgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:calc(var(--kbrow)*1px);padding:6px 8px 0}

  font-size:calc(var(--kbfs)*1px);font-weight:400;line-height:1;margin:2px;-webkit-user-select:none;user-select:none}

  border-radius:50%;background:rgba(255,255,255,.17);opacity:0;transform:scale(.55);transition:opacity .14s,transform .18s var(--ease);pointer-events:none}

.nokbhide .kbfoot{display:none}
.sig{align-self:center;font-size:11px;font-style:italic;color:#8E8E96;letter-spacing:.01em;-webkit-user-select:none;user-select:none;pointer-events:none;margin-top:-6px}
.sheet[data-hs="closed"]{visibility:hidden;margin-top:calc(-10px*var(--dens));transition:visibility 0s calc(.42s*var(--tm)),margin-top calc(.42s*var(--tm)) var(--ease)}

/* ====================== RELLENO por elemento (Automático = el de los bloques) ====================== */
.inbox,.rf input{background:var(--fill-inp,var(--s2))}

.demo-in .kb{grid-template-rows:1fr}

/* ====================== CONTORNOS por elemento ====================== */

.cap{border-radius:var(--rd-sel)}
.cap.on{outline:var(--ow-sel) var(--os-sel) var(--oc-sel);outline-offset:calc(var(--ow-sel)*-1);box-shadow:var(--bsh-sel),0 0 16px var(--cg),0 0 26px var(--cg2)}
.add{outline:var(--ow-add) var(--os-add) var(--oc-add);outline-offset:calc(var(--ow-add)*-1);border-radius:var(--rd-add);box-shadow:var(--bsh-add),0 0 20px var(--accglow)}
.statchip{box-shadow:var(--bsh-chip);outline:var(--ow-chip) var(--os-chip) var(--oc-chip);outline-offset:calc(var(--ow-chip)*-1);border-radius:var(--rd-chip)}
.chip{box-shadow:var(--bsh-meta);outline:var(--ow-meta) var(--os-meta) var(--oc-meta);outline-offset:calc(var(--ow-meta)*-1);border-radius:var(--rd-meta)}
.hb,.hbtn{box-shadow:var(--bsh-btn);outline:var(--ow-btn) var(--os-btn) var(--oc-btn);outline-offset:calc(var(--ow-btn)*-1);border-radius:var(--rd-btn)}
.row{box-shadow:var(--bsh-row);outline:var(--ow-row) var(--os-row) var(--oc-row);outline-offset:calc(var(--ow-row)*-1);border-radius:var(--rd-row)}

/* ====================== ANIMACIONES ====================== */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}

/* ============================================================
   LÓGICA DE CANTIDADES — igual que PalletFlow
   - Si la cantidad no llega a un pallet: solo jabas.
   - Si es justa: pallets completos.
   - Capacidad con "redondeo" (72 por defecto, desde más de 46 sobrantes):
       500 jabas → 6 pallets + 68  se muestra como  7 − 4
   - Resto de capacidades: pallets + sobrante.
   - Reverso: pallets × capacidad + sueltas = total de jabas.
   ============================================================ */
function calc(total, cap){
  const safe = Math.max(0, total || 0), c = Math.max(1, cap);
  const pallets = Math.floor(safe / c), rest = safe % c;
  if(safe < c) return { pallets:0, jabas:safe, onlyJabas:true, operator:null };
  if(rest === 0) return { pallets, jabas:0, onlyJabas:false, operator:null };
  const th = roundOf(c);
  if(th && rest > th) return { pallets:pallets + 1, jabas:c - rest, onlyJabas:false, operator:'-' };
  return { pallets, jabas:rest, onlyJabas:false, operator:'+' };
}
function current(){            // lo que hay escrito ahora
  const cap = S.cap;
  if(S.mode === 'fwd'){
    const n = parseInt(S.buf.main, 10) || 0;
    return n > 0 ? { mode:'f', n, cap } : null;
  }
  const p = parseInt(S.buf.p, 10) || 0, s = parseInt(S.buf.s, 10) || 0;
  return (p || s) ? { mode:'r', p, s, n:p * cap + s, cap } : null;
}

const shown = [], raf = [];
function paintNums(){
  const nums = [].slice.call($('big').querySelectorAll('.num'));
  nums.forEach((el, i) => {
    const to = +el.dataset.v, from = shown[i];
    cancelAnimationFrame(raf[i]);
    if(cfg.numAnim !== 'count' || cfg.speed === 0 || from === undefined || from === to || !booted){ shown[i] = to; return; }
    const dur = Math.min(700, 240 + Math.log10(Math.abs(to - from) + 1) * 170) * (100 / cfg.speed), t0 = performance.now();
    el.textContent = fmt(from);

      el.textContent = fmt(v); shown[i] = v;

  });

(function(){
  const dz = $('dz'), w = $('histwrap'); let drag = null;
  dz.addEventListener('pointerdown', e => {

    drag = { y0:e.clientY, h0:w.getBoundingClientRect().height, t0:performance.now(), moved:false, st:S.hs };
    try{ dz.setPointerCapture(e.pointerId); }catch(err){}
    w.style.transition = 'none'; dz.classList.add('drag');
  });
  dz.addEventListener('pointermove', e => {
    if(!drag) return;
    const dy = e.clientY - drag.y0; if(Math.abs(dy) > 5) drag.moved = true;
    if(!drag.moved) return;

  });

    if(!drag) return;
    const d = drag; drag = null; dz.classList.remove('drag'); w.style.transition = '';
    if(!d.moved){                                   // toque: abre / cierra un paso
      vib(); setHS(d.st === 'open' ? 'peek' : d.st === 'peek' ? 'open' : 'peek'); return;

    let idx = 0; hs.forEach((x, i) => { if(Math.abs(x - h) < Math.abs(hs[idx] - h)) idx = i; });

function shiftDate(t){

const jb = n => fmt(n) + ' ' + plural(n, 'jaba', 'jabas');

}

      '<input type="range" data-k="' + d.k + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + cfg[d.k] + '"></label>';
    case 'color': return '<div class="ctl"' + tt + '><span class="cl">' + d.label + '</span><input type="color" data-k="' + d.k + '" value="' + cfg[d.k].toLowerCase() + '">' +
      '<input class="hex" type="text" data-k="' + d.k + '" data-hex="1" maxlength="7" value="' + cfg[d.k].toUpperCase() + '" aria-label="Código de color"></div>';
    case 'toggle': return '<label class="ctl"' + tt + '><span class="cl">' + d.label + '</span><span class="sw"><input type="checkbox" data-k="' + d.k + '"' + (cfg[d.k] ? ' checked' : '') + '><i></i></span></label>';

      d.opts.map(o => '<button data-seg="' + d.k + '" data-v="' + o[0] + '" class="' + (String(cfg[d.k]) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div></div>';
    case 'select': return '<div class="ctl col"' + tt + '><div class="top"><span class="cl">' + d.label + '</span></div><select data-k="' + d.k + '">' +
      d.opts.map(o => '<option value="' + o[0] + '"' + (cfg[d.k] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>';
    case 'text': return '<div class="ctl col"' + tt + '><div class="top"><span class="cl">' + d.label + '</span></div><input class="txt" type="text" data-k="' + d.k + '" maxlength="40" value="' + esc(cfg[d.k]) + '"></div>';

  root.style.setProperty('--vh', h + 'px');
  updateCompact();
  if(window.visualViewport) window.scrollTo(0, 0);
  applyCfg(); applyHist(false);
  if($('cust').classList.contains('open')) demoScale();
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0)); }
window.addEventListener('resize', fit);
if(window.ResizeObserver) new ResizeObserver(schedHalo).observe($('stage'));
document.addEventListener('visibilitychange', () => { if(!document.hidden) $('dateLine').textContent = dateLine(); });

/* ============================================================
   INICIO
   ============================================================ */
loadCfg(); loadState();
applyCfg();
buildCaps(); syncInputs(); fit(); render();
setTimeout(() => { booted = true; }, 600);
/* Botón «atrás» de Android: primero cierra lo que esté abierto; si no hay nada, minimiza la app */
try{
  const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(CapApp) CapApp.addListener('backButton', () => {
    if($('cust').classList.contains('open')) closeCust();
    else if(kbOpen) hideKb();
    else if(S.hs !== 'closed') setHS('closed');
    else if(CapApp.minimizeApp) CapApp.minimizeApp(); else CapApp.exitApp();
  });
}catch(e){}
if(cfg.autofocus) setTimeout(() => { if(cfg.kbOn) showKb(); focusMain(false); }, 60);
})();
</script>
</body>
</html>
